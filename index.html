/* ============================ EXPORTAÇÃO ============================ */
function colunas(){
  const set0 = new Set();
  ativos().forEach(c=>Object.keys(c).forEach(k=>{ if(["_uid","_atualizado","_apagado","_sinc"].indexOf(k)<0 && k.indexOf("_imp_")!==0 && k.indexOf("_auto_")!==0) set0.add(k); }));
  const fixas = ["id","data","idade","sexo","preenchido_por","ativacao"].concat(HORARIOS.map(x=>x[0]));
  const resto = [...set0].filter(k=>fixas.indexOf(k)<0).sort();
  return fixas.filter(k=>set0.has(k)||true).concat(resto);
}
function csv(){
  const cols = colunas();
  const der = ["_gcs_total","_shock_index","_rabt","_rts_t","_rts_ponderado","_iss","_triss_ps","_triss_coef",
               "_porta_tc_min","_porta_transf_min","_porta_cc_min","_tempo_sala_min","_trauma_atx_min"].concat(["_tcci_indicada","_tcci_criterios","_tcseg_criterios"]).concat(MECANISMOS.map(slugMec)).concat(XABCDE.map(x=>"_status_"+x[1]));
  const head = cols.concat(der).join(";");
  const linhas = ativos().map(c=>{
    const salvo = atualUid;
    atualUid = c._uid;
    const d = {
      _gcs_total: gcsTotal() ?? "",
      _shock_index: shockIndex() ?? "",
      _rabt: rabtPontos(),
      _rts_t: rtsT() ?? "",
      _rts_ponderado: rtsW() ?? "",
      _iss: iss() ?? "",
      _triss_ps: triss() ?? "",
      _triss_coef: (rtsW()!==null && iss()!==null) ? (trissPenetrante()?"penetrante":"contuso") : "",
      _porta_tc_min: difMin(c.h_porta,c.h_tc) ?? "",
      _porta_transf_min: difMin(c.h_porta,c.h_transf) ?? "",
      _porta_cc_min: difMin(c.h_porta,c.h_cc) ?? "",
      _tempo_sala_min: difMin(c.h_porta,c.h_saida) ?? "",
      _trauma_atx_min: difMin(c.h_trauma,c.h_atx) ?? ""
    };
    const _ti = indicacoes(TCCI_GRUPOS,"tcci_ind"), _ts = indicacoes(TCSEG_GRUPOS,"tcseg_ind");
    d._tcci_indicada = _ti.length ? "sim" : "não"; d._tcci_criterios = _ti.join(" | "); d._tcseg_criterios = _ts.join(" | ");
    XABCDE.forEach(x=>{ const st = estadoX(x[1]); d["_status_"+x[1]] = st==="N" ? "normal" : (st==="A" ? "alterado" : ""); });
    MECANISMOS.forEach(m=>{ d[slugMec(m)] = (Array.isArray(c.mecanismo) && c.mecanismo.indexOf(m)>=0) ? 1 : 0; });
    atualUid = salvo;
    const cel = k=>{
      let v = (k in d) ? d[k] : c[k];
      if(v===undefined||v===null) v="";
      if(Array.isArray(v)) v = v.join(" | ");
      if(v===true) v="sim";
      /* Excel pt-BR com separador ";" espera vírgula decimal — ponto viraria texto */
      if(typeof v==="number") v = String(v).replace(".",",");
      v = String(v).replace(/"/g,'""').replace(/\r?\n/g," / ");
      return /[;"\n]/.test(v) ? '"'+v+'"' : v;
    };
    return cols.map(cel).concat(der.map(cel)).join(";");
  });
  return "﻿" + [head].concat(linhas).join("\r\n");
}
function exportar(){
  document.getElementById("csvOut").textContent = csv();
  document.getElementById("dlgExport").showModal();
}
function baixar(txt, nome, tipo){
  const b = new Blob([txt], {type:tipo});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href=u; a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 1500);
}

/* ============================ SINCRONIZAÇÃO ============================ */
const Sync = (()=>{
  let db=null, auth=null, user=null, timer=null, pendente=false, erro="";
  const ligado = ()=> !!(FIREBASE_CONFIG && user && user.emailVerified);
  function carregarScript(src){
    return new Promise((ok,falha)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=falha; document.head.appendChild(s); });
  }
  async function iniciar(){
    if(!FIREBASE_CONFIG){ chip(); return; }
    try{
      const base = "https://www.gstatic.com/firebasejs/"+FIREBASE_VER+"/";
      await carregarScript(base+"firebase-app-compat.js");
      await carregarScript(base+"firebase-auth-compat.js");
      await carregarScript(base+"firebase-firestore-compat.js");
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth(); db = firebase.firestore();
      /* fila offline: o que for salvo sem rede sobe sozinho quando a rede voltar */
      try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){}
      auth.onAuthStateChanged(async u=>{
        user=u;
        if(u && !u.emailVerified){ try{ await u.reload(); user = auth.currentUser; }catch(e){} }
        chip(); if(ligado()) escutar(); render();
      });
    }catch(e){ erro="sem rede para carregar a sincronização (os dados seguem salvos no aparelho)"; chip(); }
  }
  let parar=null;
  function escutar(){
    if(parar) parar();
    parar = db.collection("casos").onSnapshot({includeMetadataChanges:true}, snap=>{
      pendente = snap.metadata.hasPendingWrites; chip();
      if(snap.metadata.hasPendingWrites) return;
      const remotos = snap.docs.map(d=>d.data());
      const mapa = new Map(remotos.map(r=>[r._uid,r]));
      CASOS = mesclar(CASOS, remotos); gravarLocal();
      /* sobe o que só existe aqui, ou está mais novo aqui */
      CASOS.forEach(c=>{ const r=mapa.get(c._uid); if(!r || String(c._atualizado)>String(r._atualizado)) enviar(c); });
      if(vista==="lista") render();
      else document.getElementById("chipCaso").textContent = get("id")||"—";
    }, e=>{ erro = "sem permissão — confira as regras do Firestore e o e-mail autorizado"; chip(); });
  }
  function enviar(c){
    if(!ligado()) return;
    const limpo = JSON.parse(JSON.stringify(c)); /* Firestore não aceita undefined */
    limpo._por = user.email || "";
    db.collection("casos").doc(c._uid).set(limpo).catch(()=>{});
  }
  function agendar(){
    if(!ligado()) return;
    clearTimeout(timer);
    timer = setTimeout(()=>{ const c = CASOS.find(x=>x._uid===atualUid); if(c) enviar(c); else enviarTudo(); }, 600);
  }
  function enviarTudo(){ if(ligado()) CASOS.forEach(enviar); }
  function chip(){
    const b = document.getElementById("btnSync"); if(!b) return;
    if(!FIREBASE_CONFIG) b.textContent = "☁︎ local";
    else if(erro) b.textContent = "☁︎ erro";
    else if(!user) b.textContent = "☁︎ entrar";
    else if(!user.emailVerified) b.textContent = "☁︎ confirmar e-mail";
    else b.textContent = pendente || !navigator.onLine ? "☁︎ aguardando rede" : "☁︎ na nuvem";
  }
  window.addEventListener("online", chip); window.addEventListener("offline", chip);
  function abrirDialogo(){
    let sig=""; try{ sig = localStorage.getItem(KEY_SIGLA)||""; }catch(e){}
    let h = '<label class="hint">Sigla deste aparelho (opcional, ex.: IP1). Entra no código do caso e impede '
          + 'que dois aparelhos gerem o mesmo número sem rede.</label>'
          + '<input id="inSigla" maxlength="4" value="'+esc(sig)+'" placeholder="IP1">';
    if(!FIREBASE_CONFIG){
      h += '<p class="hint">Sincronização desligada: os casos ficam só neste aparelho. Para ligar, o responsável pelo app '
         + 'preenche FIREBASE_CONFIG no index.html (instruções no LEIA-ME).</p>';
    }else if(!user){
      h += (erro?'<p class="aviso r">'+esc(erro)+'</p>':'')
         + '<label class="hint">E-mail institucional</label><input id="inEmail" type="email" autocomplete="username" placeholder="nome@unifesp.br">'
         + '<label class="hint">Senha (mín. 6 caracteres)</label><input id="inSenha" type="password" autocomplete="current-password">'
         + '<div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn g" id="btnEntrar">Entrar e sincronizar</button>'
         + '<button class="btn" id="btnCriar">Criar conta</button>'
         + '<button class="btn" id="btnEsqueci">Esqueci a senha</button></div>'
         + '<p class="hint" style="margin-top:8px">Só e-mails autorizados pela coordenação enxergam os casos. Na primeira vez, use "Criar conta" e confirme o link que chega no seu e-mail.</p>';
    }else if(!user.emailVerified){
      h += '<p>Conta criada para <b>'+esc(user.email||"")+'</b>. Abra o link de confirmação que enviamos para esse e-mail '
         + '(confira também o spam) e depois toque em "Já confirmei".</p>'
         + '<div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn g" id="btnJaConfirmei">Já confirmei</button>'
         + '<button class="btn" id="btnReenviar">Reenviar e-mail</button><button class="btn" id="btnSair">Sair</button></div>';
    }else{
      h += '<p>Conectado como <b>'+esc(user.email||"")+'</b>. '+(erro?'<span style="color:#ff6b6f">'+esc(erro)+'</span>':'Casos salvos aqui aparecem nos outros aparelhos logados.')+'</p>'
         + '<button class="btn" id="btnSair">Sair</button>';
    }
    document.getElementById("syncBody").innerHTML = h;
    document.getElementById("inSigla").addEventListener("input", e=>{
      const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""); e.target.value = v;
      try{ localStorage.setItem(KEY_SIGLA, v); }catch(_){}
    });
    const msg = e=>{
      const c = (e && e.code) || "";
      return ({ "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/wrong-password":"Senha incorreta.",
        "auth/user-not-found":"Conta não encontrada — use Criar conta.", "auth/email-already-in-use":"Esse e-mail já tem conta — use Entrar.",
        "auth/weak-password":"Senha fraca: use pelo menos 6 caracteres.", "auth/invalid-email":"E-mail inválido.",
        "auth/network-request-failed":"Sem internet no momento.", "auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos." }[c]) || ("Erro: "+(c||e.message));
    };
    const campos = ()=>[document.getElementById("inEmail").value.trim().toLowerCase(), document.getElementById("inSenha").value];
    const fechar = ()=> document.getElementById("dlgSync").close();
    const on = (id, fn)=>{ const el = document.getElementById(id); if(el) el.addEventListener("click", fn); };
    on("btnEntrar", async ()=>{
      erro=""; const [em,se] = campos();
      try{ await auth.signInWithEmailAndPassword(em, se); fechar(); setTimeout(abrirDialogo, 300); }
      catch(e){ alert(msg(e)); }
    });
    on("btnCriar", async ()=>{
      erro=""; const [em,se] = campos();
      try{
        auth.languageCode = "pt";
        const r = await auth.createUserWithEmailAndPassword(em, se);
        await r.user.sendEmailVerification();
        alert("Conta criada. Enviamos um link de confirmação para "+em+".");
        fechar(); setTimeout(abrirDialogo, 300);
      }catch(e){ alert(msg(e)); }
    });
    on("btnEsqueci", async ()=>{
      const em = document.getElementById("inEmail").value.trim();
      if(!em) return alert("Digite seu e-mail primeiro.");
      try{ auth.languageCode = "pt"; await auth.sendPasswordResetEmail(em); alert("Enviamos um link para redefinir a senha."); }
      catch(e){ alert(msg(e)); }
    });
    on("btnJaConfirmei", async ()=>{
      try{ await user.reload(); user = auth.currentUser; await user.getIdToken(true); }catch(e){}
      if(user && user.emailVerified){ chip(); escutar(); fechar(); render(); }
      else alert("Ainda não consta como confirmado. Abra o link do e-mail e tente de novo.");
    });
    on("btnReenviar", async ()=>{
      try{ auth.languageCode = "pt"; await user.sendEmailVerification(); alert("E-mail reenviado."); }catch(e){ alert(msg(e)); }
    });
    on("btnSair", ()=>{ if(parar) parar(); auth.signOut(); fechar(); });
    document.getElementById("dlgSync").showModal();
  }
  return { iniciar, agendar, enviarTudo, ligado, abrirDialogo };
})();
document.getElementById("btnSync").addEventListener("click", ()=> Sync.abrirDialogo());
document.getElementById("btnCloseSync").addEventListener("click", ()=> document.getElementById("dlgSync").close());

/* ============================ INÍCIO ============================ */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
/* pede ao navegador para não apagar os dados por falta de espaço/uso */
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
document.getElementById("logosTop").innerHTML = htmlLogos();
carregar();
render();
Sync.iniciar();
</script>
</body>
</html>
