<!DOCTYPE html>
<!--
  Ficha de Padronização Assistencial de Atendimento ao Politraumatizado
  PS Cirurgia Geral · Hospital São Paulo · Escola Paulista de Medicina – UNIFESP
  © Outubro de 2026 — Lucas Domingos Ribeiro e Marcos Vinícius Veanholi
  Orientação: Prof. Dr. Diego Adão
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ficha Trauma">
<meta name="theme-color" content="#0c141f">
<link rel="manifest" href="manifest.json">

<title>Ficha de Padronização Assistencial — Politraumatizado · EPM-UNIFESP</title>
<meta name="author" content="Lucas Domingos Ribeiro; Marcos Vinícius Veanholi — orientação: Prof. Dr. Diego Adão">
<style>
  :root{
    --navy:#12253d; --red:#c62828; --green:#2e7d32; --amber:#b26a00;
    --line:#c8ccd2; --bg:#eef0f3; --card:#fff; --ink:#16181c; --mut:#5c636c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; height:100%}
  body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
       color:var(--ink); background:var(--bg); overscroll-behavior:none}
  button{font:inherit; cursor:pointer}
  input,textarea,select{font:inherit}

  /* ---------- barra superior ---------- */
  .top{position:sticky; top:0; z-index:50; background:var(--navy); color:#fff;
       padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; display:flex; align-items:center; gap:10px}
  .top h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.2px; white-space:nowrap}
  .top .sp{flex:1}
  .top .chip{background:rgba(255,255,255,.16); padding:5px 10px; border-radius:6px; font-size:13px}
  .btn{border:0; border-radius:8px; padding:10px 14px; font-weight:600; font-size:15px;
       background:#e7e9ed; color:var(--navy); min-height:44px}
  .btn.p{background:var(--red); color:#fff}
  .btn.g{background:var(--green); color:#fff}
  .btn.o{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5)}
  .btn:active{opacity:.75}

  /* ---------- abas ---------- */
  .tabs{display:flex; gap:4px; overflow-x:auto; background:#dfe3e8; padding:6px 8px;
        position:sticky; top:0; z-index:40; -webkit-overflow-scrolling:touch}
  .tabs button{border:0; background:#fff; color:var(--navy); border-radius:8px;
               padding:10px 14px; white-space:nowrap; font-size:14px; font-weight:600; min-height:44px}
  .tabs button.on{background:var(--navy); color:#fff}
  .tabs button.done::after{content:" ✓"; color:var(--green)}
  .tabs button.on.done::after{color:#8fe39a}

  /* ---------- layout ---------- */
  .wrap{padding:12px 12px 90px; max-width:1400px; margin:0 auto}
  .sec{background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px;
       box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .sec h2{font-size:14px; margin:0 0 10px; color:var(--navy); text-transform:uppercase;
          letter-spacing:.6px; border-bottom:2px solid var(--navy); padding-bottom:5px}
  .grid{display:grid; gap:10px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
  @media(max-width:780px){.g3,.g4,.g6{grid-template-columns:repeat(2,1fr)}}
  .fld{display:flex; flex-direction:column; gap:5px}
  .fld>label{font-size:13px; font-weight:600; color:var(--mut)}
  .fld input[type=text],.fld input[type=number],.fld textarea,.fld select{
    border:1px solid var(--line); border-radius:8px; padding:11px 10px; font-size:16px; width:100%;
    background:#fff; min-height:44px}
  .fld textarea{min-height:66px; resize:vertical}

  /* ---------- opções (radio/multi) ---------- */
  .opts{display:flex; flex-wrap:wrap; gap:6px}
  .opt{border:1.5px solid var(--line); background:#fff; border-radius:9px; padding:10px 12px;
       font-size:15px; color:var(--ink); min-height:44px; display:flex; align-items:center}
  .opt.on{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600}
  .opt.on.warn{background:var(--red); border-color:var(--red)}
  .gcs{display:flex; flex-direction:column; gap:5px}
  .gcs .opt{display:flex; align-items:center; gap:10px; text-align:left; width:100%; padding:9px 10px}
  .gcs .opt b{flex:0 0 26px; height:26px; border-radius:6px; background:#e7e9ed; color:var(--navy);
       display:flex; align-items:center; justify-content:center; font-size:15px}
  .gcs .opt.on b{background:#fff}
  .gcs .opt small{display:block; font-size:12px; opacity:.75; font-weight:400}
  .gcsg{grid-template-columns:repeat(3,1fr)}
  @media(max-width:780px){.gcsg{grid-template-columns:1fr}}
  .fwin{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 10px; margin:6px 0;
        border:1.5px solid var(--line); border-radius:10px; background:#fff}
  .fwin .fwl{flex:1 1 140px; font-weight:700; color:var(--navy)}
  .fwin .fwl small{display:block; font-weight:400; font-size:12px; color:var(--mut)}
  .fwin .opts{flex:2 1 220px}
  .fwin .opts .opt{flex:1; justify-content:center; text-align:center}
  .fwin.pos{border-color:var(--red); background:#fdeaea}
  .fwin.pos .fwl{color:var(--red)}
  .opt.on.good{background:var(--green); border-color:var(--green)}

  /* ---------- normal/alterado ---------- */
  .xrow{border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px}
  .xhead{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .xltr{background:var(--navy); color:#fff; width:34px; height:34px; border-radius:8px;
        display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex:none}
  .xnorm{flex:1; font-size:14px; color:var(--mut)}
  .btn-norm{border:1.5px solid var(--green); color:var(--green); background:#fff;
            border-radius:9px; padding:10px 14px; font-weight:700; min-height:44px; white-space:nowrap}
  .btn-norm.on{background:var(--green); color:#fff}
  .btn-alt{border:1.5px solid var(--red); color:var(--red); background:#fff;
           border-radius:9px; padding:10px 14px; font-weight:700; min-height:44px; white-space:nowrap}
  .btn-alt.on{background:var(--red); color:#fff}
  .xbtns{display:flex; gap:8px; flex:none}
  .xhead{flex-wrap:wrap}
  @media(max-width:780px){ .xbtns{flex:1 1 100%} .xbtns button{flex:1} }
  .xrow.alt{border-color:var(--red); background:#fffafa}
  .xrow.ok{border-color:var(--green)}
  .xrow.alt textarea{border-color:var(--red)}

  /* ---------- horários ---------- */
  .clock{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; align-items:start}
  @media(max-width:780px){.clock{grid-template-columns:repeat(2,1fr)}}
  .tcard{border:1.5px solid var(--line); border-radius:10px; padding:8px; text-align:center; background:#fff;
         display:flex; flex-direction:column}
  .tcard.set{border-color:var(--navy); background:#f2f6fb}
  .tcard.na{border-style:dashed; opacity:.6}
  .tcard .tl{font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase;
             letter-spacing:.2px; min-height:22px; line-height:1.1; display:flex; align-items:center; justify-content:center}
  .tcard .tv{font-size:21px; font-weight:800; color:var(--navy); letter-spacing:.5px; margin:1px 0 5px;
             font-variant-numeric:tabular-nums; line-height:1.15; white-space:nowrap; overflow:hidden}
  .tcard .tv.off{color:#c3c8ce}
  .trow{display:flex; gap:5px}
  button.tcard{width:100%; font:inherit; cursor:pointer}
  button.tcard:not(.set):not(.na){border-color:var(--red); border-style:solid}
  button.tcard:not(.set):not(.na) .tv{color:var(--red)}
  .tcard.lock{cursor:default}
  .tcard .tsub{font-size:11px; color:var(--mut); min-height:15px}
  .tcard input[type=time]{width:100%; font-size:20px; font-weight:800; color:var(--navy); text-align:center;
       border:1.5px solid var(--line); border-radius:7px; padding:6px 2px; margin:2px 0 5px; background:#fff}
  .tnow{flex:1; background:var(--red); color:#fff; border:0; border-radius:7px; padding:9px 4px;
        font-weight:800; font-size:13.5px; min-height:44px}
  .tsm{background:#e7e9ed; color:var(--navy); border:0; border-radius:7px; padding:9px 8px;
       font-size:13px; font-weight:700; min-height:44px}

  /* ---------- alertas ---------- */
  .alert{border-radius:10px; padding:11px 13px; margin:10px 0; font-weight:700; font-size:15px}
  .alert.r{background:#fdeaea; color:#8c2020; border:1.5px solid var(--red)}
  .alert.g{background:#eaf5ea; color:#1b5e20; border:1.5px solid var(--green)}
  .alert.a{background:#fff6e5; color:#7a4a00; border:1.5px solid var(--amber)}
  .hint{font-size:12.5px; color:var(--mut)}

  /* ---------- painéis de escore ---------- */
  .score{border:1.5px solid var(--line); border-left-width:6px; border-radius:10px;
         padding:10px 14px; background:#fff}
  .score.r{border-color:var(--red); background:#fdeaea}
  .score.g{border-color:var(--green); background:#f2f9f2}
  .score.a{border-color:var(--amber); background:#fff8ec}
  .score .sl{font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:.5px}
  .score .sv{font-size:30px; font-weight:800; color:var(--navy); line-height:1.15; margin:2px 0}
  .score .sd{font-size:13px; color:var(--mut)}

  /* ---------- rodapé fixo ---------- */
  .foot{position:fixed; left:0; right:0; bottom:0; z-index:60; background:#fff;
        border-top:1px solid var(--line); padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
        display:flex; gap:8px; align-items:center}
  .foot .sp{flex:1}
  .save{font-size:13px; color:var(--green); font-weight:700}

  /* ---------- lista de casos ---------- */
  .caso{display:flex; align-items:center; gap:12px; border:1px solid var(--line);
        border-radius:10px; padding:12px; margin-bottom:8px; background:#fff}
  .caso .id{font-weight:800; color:var(--navy); font-size:16px; min-width:130px}
  .caso .meta{flex:1; font-size:13.5px; color:var(--mut)}
  .badge{font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px}
  .badge.open{background:#fff6e5; color:#7a4a00}
  .badge.closed{background:#eaf5ea; color:#1b5e20}
  .empty{text-align:center; color:var(--mut); padding:40px 10px}
  dialog{border:0; border-radius:14px; padding:0; max-width:560px; width:92%}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg{padding:18px}
  .dlg h3{margin:0 0 8px; color:var(--navy)}
  .mono{font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:pre-wrap;
        background:#f4f6f8; border:1px solid var(--line); border-radius:8px; padding:10px;
        max-height:40vh; overflow:auto}
  .aviso{background:#fff4e5; border:1px solid #f0b46a; color:#5a3a00; border-radius:10px;
         padding:10px 12px; margin-bottom:12px; font-size:14px}
  .aviso.r{background:#fdecea; border-color:#e9a39d; color:#7a1712}
  .fld input.sync, .dlg input{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin:4px 0 8px}

  /* =================== TEMA ESCURO — identidade EPM/UNIFESP =================== */
  :root{
    color-scheme:dark;         /* relógio, teclado numérico e seletores nativos no escuro */
    --navy:#dbe7f5;            /* texto de destaque (títulos) */
    --acc:#3b82d6; --acc2:#9cc3ef;
    --red:#e5484d; --green:#3fb950; --amber:#d4a72c;
    --line:#2a3b55; --bg:#0c141f; --card:#131f30; --card2:#0f1926;
    --ink:#e6edf5; --mut:#8fa2bb;
  }
  body{background:radial-gradient(1200px 500px at 50% -200px,#1a2b44 0%,var(--bg) 60%) fixed, var(--bg)}
  .top{background:rgba(12,20,31,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
       border-bottom:1px solid var(--line); gap:8px}
  .top .brand{display:flex; flex-direction:column; min-width:0; flex:1 1 auto; line-height:1.15}
  .top .brand b{font-size:14px; letter-spacing:1.4px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .top .sp{display:none}
  @media(max-width:480px){ .top .logos{display:none} .top .brand small{display:none}
    .top .brand b{font-size:13px; letter-spacing:.6px} .btn.o{padding:8px 9px} .top .chip{font-size:12px; padding:5px 8px} .logos img{height:26px} }
  .top .brand small{font-size:10.5px; letter-spacing:1.2px; color:var(--mut); text-transform:uppercase;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .logos{display:flex; gap:6px; align-items:center; flex:none}
  .logos img{height:30px; width:auto; border-radius:4px; background:#fff; padding:2px}
  .top .chip{background:#1d2c43; color:var(--acc2); font-weight:700; letter-spacing:.4px; white-space:nowrap}
  .btn{background:#1d2c43; color:var(--ink); border:1px solid var(--line)}
  .btn.p{background:#c62828; border-color:#c62828}
  .btn.g{background:#238636; border-color:#238636}
  .btn.o{border-color:#3a5070; color:#e6edf5; white-space:nowrap; padding:8px 11px; min-height:38px; font-size:13.5px}

  .tabs{background:#0c141f; border-bottom:2px solid var(--acc); padding:4px 6px 0; gap:2px}
  .tabs button{background:transparent; color:var(--mut); border-radius:0; text-transform:uppercase;
       letter-spacing:1.2px; font-size:12.5px; font-weight:800; border-bottom:3px solid transparent; padding:12px 12px 9px}
  .tabs button.on{background:transparent; color:#fff; border-bottom-color:var(--acc)}

  .sec{background:var(--card); border:1px solid var(--line); box-shadow:none}
  .sec h2{color:#fff; border-bottom:1px solid var(--line); letter-spacing:1.4px; font-size:13.5px}
  .fld>label{text-transform:uppercase; letter-spacing:.9px; font-size:12px; color:var(--mut)}
  .fld input[type=text],.fld input[type=number],.fld textarea,.fld select,.dlg input,
  .tcard input[type=time]{background:var(--card2); color:var(--ink); border-color:var(--line)}
  .fld input::placeholder,.fld textarea::placeholder{color:#5d7090}
  input[type=number]{color:var(--ink); background:var(--card2)}
  input:focus,textarea:focus{outline:2px solid var(--acc); outline-offset:0}

  .opt{background:var(--card2); color:var(--ink); border-color:var(--line)}
  .opt.on{background:var(--acc); border-color:var(--acc); color:#fff}
  .opt.on.warn{background:#c62828; border-color:#c62828}
  .opt.on.good{background:#238636; border-color:#238636}
  .gcs .opt b{background:#1d2c43; color:var(--acc2)}
  .gcs .opt.on b{background:#fff; color:var(--acc)}

  .fwin{background:var(--card2); border-color:var(--line)}
  .fwin .fwl{color:var(--ink)}
  .fwin.pos{background:rgba(229,72,77,.14); border-color:var(--red)}
  .fwin.pos .fwl{color:#ff8a8d}

  .xrow{background:var(--card2); border-color:var(--line)}
  .xltr{background:var(--acc); color:#fff}
  .xnorm{color:#b8c6d8}
  .xnorm b{color:#fff}
  .btn-norm{background:transparent; color:var(--green); border-color:var(--green)}
  .btn-norm.on{background:#238636; border-color:#238636; color:#fff}
  .btn-alt{background:transparent; color:#ff6b6f; border-color:var(--red)}
  .btn-alt.on{background:#c62828; border-color:#c62828; color:#fff}
  .xrow.alt{background:rgba(229,72,77,.08); border-color:var(--red)}
  .xrow.ok{border-color:#2f7d3e}

  .tcard{background:var(--card2); border-color:var(--line)}
  .tcard.set{background:#16263d; border-color:var(--acc)}
  .tcard .tv{color:#fff}
  .tcard .tv.off{color:#41536d}
  button.tcard:not(.set):not(.na) .tv{color:#ff6b6f}
  .tsm{background:#1d2c43; color:var(--ink)}

  .alert.r{background:rgba(229,72,77,.14); color:#ffb3b5; border-color:var(--red)}
  .alert.g{background:rgba(63,185,80,.12); color:#8fe39a; border-color:var(--green)}
  .alert.a{background:rgba(212,167,44,.13); color:#f2cc60; border-color:var(--amber)}
  .score{background:var(--card2); border-color:var(--line)}
  .score.r{background:rgba(229,72,77,.12); border-color:var(--red)}
  .score.g{background:rgba(63,185,80,.10); border-color:var(--green)}
  .score.a{background:rgba(212,167,44,.12); border-color:var(--amber)}
  .score .sv{color:#fff}

  .foot{background:rgba(12,20,31,.96); border-top-color:var(--line)}
  .caso{background:var(--card2); border-color:var(--line)}
  .caso .id{color:#fff; font-variant-numeric:tabular-nums}
  .badge.open{background:rgba(212,167,44,.16); color:#f2cc60}
  .badge.closed{background:rgba(63,185,80,.15); color:#8fe39a}
  dialog{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .dlg h3{color:#fff}
  .mono{background:var(--card2); color:#b8c6d8}
  .aviso{background:rgba(212,167,44,.12); border-color:#6b5520; color:#f2cc60}
  .aviso.r{background:rgba(229,72,77,.12); border-color:#7a2a2c; color:#ffb3b5}
  .pend{background:rgba(212,167,44,.15); color:#f2cc60; border:1.5px solid var(--amber); border-radius:999px;
        font-size:12px; font-weight:800; padding:6px 11px; white-space:nowrap}

  /* ---------- capa (lista de casos) ---------- */
  .hero{text-align:center; padding:22px 8px 18px; margin-bottom:14px; border-bottom:1px solid var(--line)}
  .hero .logos{justify-content:center; gap:14px; margin-bottom:14px}
  .hero .logos img{height:64px; padding:4px; border-radius:8px}
  .hero h1{margin:0; font-weight:900; text-transform:uppercase; letter-spacing:3px; line-height:1.2;
       font-size:clamp(20px, 4.2vw, 38px);
       background:linear-gradient(180deg,#ffffff 0%,#b9d3f3 100%); -webkit-background-clip:text; background-clip:text; color:transparent}
  .hero .sub{margin-top:12px; color:var(--mut); text-transform:uppercase; letter-spacing:2.6px; font-size:clamp(11px,2.6vw,14px); line-height:1.6}
  .hero .sub b{color:#cfe0f5; font-weight:700}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 4px}
  @media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .stat .l{color:var(--mut); font-size:13.5px}
  .stat .v{font-size:32px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; line-height:1.2; margin-top:6px}
  .box{padding:10px; border:1.5px solid var(--line); border-radius:10px; background:var(--card2)}
  .box.pos{border-color:var(--red); background:rgba(229,72,77,.08)}
  .boxt{font-weight:700; color:#fff; margin-bottom:4px}
  .tabs{top:var(--topH,0px)}
  .pcr{margin-top:10px; padding:10px; border:1.5px solid var(--red); border-radius:10px; background:rgba(229,72,77,.08)}
  .st{border-radius:14px; padding:14px; margin-bottom:12px; border:2px solid #7a1d22;
      background:linear-gradient(135deg, rgba(150,20,30,.28), rgba(19,31,48,.9))}
  .st.on{border-color:#ff4d55; box-shadow:0 0 0 3px rgba(255,77,85,.18), 0 0 24px rgba(255,77,85,.25);
      background:linear-gradient(135deg, rgba(200,25,40,.42), rgba(60,12,18,.85))}
  .sthead{display:flex; align-items:center; gap:12px}
  .sthead b{display:block; color:#fff; font-size:18px; letter-spacing:2px}
  .sthead small{display:block; color:#ffb3b5; font-size:12.5px; letter-spacing:.4px}
  .stdrop{font-size:30px; line-height:1}
  .stbtn{width:100%; margin-top:12px; min-height:56px; border:0; border-radius:10px; font-weight:900;
      letter-spacing:2px; font-size:17px; color:#fff; background:#c62828}
  .st .fld>label{color:#ffcdd0}
  .badge.st{background:rgba(229,72,77,.2); color:#ffb3b5; margin-right:4px}
  .creditos{text-align:center; color:var(--mut); font-size:12.5px; line-height:1.7; padding:18px 10px 8px;
       border-top:1px solid var(--line); margin-top:8px}
  .creditos b{color:#cfe0f5; font-weight:700}
  .creditos .cr{letter-spacing:1.6px; text-transform:uppercase; font-size:11px; margin-bottom:6px}
  .stat .v.g{color:var(--green)} .stat .v.a{color:var(--amber)}
</style>
</head>
<body>

<div class="top">
  <div class="logos" id="logosTop"></div>
  <div class="brand"><b>FICHA DE TRAUMA</b><small>PS Cirurgia Geral · Hospital São Paulo</small></div>
  <span class="chip" id="chipCaso">—</span>
  <span class="sp"></span>
  <button class="btn o" id="btnSync" title="Sincronização">☁︎ local</button>

<script>
"use strict";

/* ============================ ESQUEMA ============================ */
const HORARIOS = [
  ["h_trauma","Trauma"],["h_porta","Porta (chegada)"],["h_acesso","1º acesso funcionante"],
  ["h_efast","E-FAST"],["h_atx","Ácido tranexâmico"],["h_ptm","PTM acionado"],["h_st","Sangue total acionado"],
  ["h_transf","1ª transfusão"],["h_tc","TC executada"],["h_aviso","Aviso cirúrgico"],
  ["h_cc","Entrada no CC"],["h_uti","Admissão UTI"],["h_saida","Saída da sala"]
];

/* marcar o horário já responde a pergunta correspondente em outra aba */
const HORARIO_IMPLICA = {
  h_atx: ["atx","Feito"], h_ptm: ["ptm","Acionado"], h_st: ["st_acionado","Sim"], h_tc: ["tc","Sim"],
  h_efast: ["efast_global", null]   /* null = só registra que foi feito; resultado continua manual */
};

/* Frases-padrão de NORMAL do serviço. Os {campos} são preenchidos com os
   valores já registrados na Admissão / FAST; vazio aparece como "__". */
const XABCDE = [
  ["X","x","Sem sangramento ameaçador à vida.",
   ["Compressão","Torniquete","Sutura hemostática"]],
  ["A","a","Via aérea pérvia, sem enfisema ou hematoma cervical, sem desvio de traqueia, com CC + PR.",
   ["IOT","Cricotireoidostomia","Cânula orofaríngea"]],
  ["B","b","FR: {fr} irpm. SO2: {spo2}% aa. Expansibilidade torácica simétrica, sem enfisema de subcutâneo. "
         + "E-FAST com {ls}, sem outros achados.",
   ["Dreno à direita","Dreno à esquerda","Descompressão por agulha"]],
  ["C","c","PA: {pa}, FC {fc} bpm, sem dor à palpação abdominal e sem dor à palpação de ossos longos, "
         + "pelve estável, TEC < 3 segundos, BCNF. FAST {fast}.",
   ["Cinta pélvica","Acesso intraósseo","Acesso central"]],
  ["D","d","Glasgow {gcs} (O: {o} V: {v} M: {m}), pupilas isocóricas e fotorreagentes. Sem déficits focais.",
   ["Sinais de hipertensão intracraniana","Neurocirurgia acionada"]],
  ["E","e","Dorso sem desalinhamento e sem lesões cutâneas. Controle térmico. Pulsos 4/4+ presentes bilateralmente. "
         + "Sem dor à palpação de ossos longos. Sem dor à palpação de coluna.",
   ["Manta térmica","Fluido aquecido","Nenhum aquecimento"]]
];
function fraseX(frase){
  const v = k => { const x = get(k); return (x===undefined || x==="") ? "__" : esc(x); };
  const fast = get("efast_global");
  const vals = {
    fr: v("adm_fr"), spo2: v("adm_spo2"), fc: v("adm_fc"),
    pa: (get("adm_pas")||get("adm_pad")) ? v("adm_pas")+"x"+v("adm_pad")+" mmHg" : "__",
    /* LS e FAST só aparecem depois do exame — nunca presumidos */
    fast: fast ? esc(fast.toLowerCase()) : "__",
    ls: lsTexto(),
    gcs: gcsTotal()!==null ? gcsTotal() : "__", o: v("gcs_o"), v: v("gcs_v"), m: v("gcs_m")
  };
  return esc(frase).replace(/\{(\w+)\}/g, (_,k)=> '<b>'+(vals[k]!==undefined ? vals[k] : "__")+'</b>');
}
/* ---------- E-FAST: lung sliding por hemitórax e janelas abdominais ---------- */
const LS_LADOS = [["efast_ls_d","Hemitórax direito"],["efast_ls_e","Hemitórax esquerdo"]];
const FAST_JANELAS = [["fast_morrison","Hepatorrenal","espaço de Morrison"],
                      ["fast_subxifoide","Pericárdica","subxifoide"],
                      ["fast_espleno","Esplenorrenal",""],
                      ["fast_pelvica","Pélvica","suprapúbica"]];
const FAST_VALS = [["+","Positivo"],["−","Negativo"],["NR","NR"]];

/* resumos calculados a partir dos detalhes (mantêm os campos antigos para RABT/CSV) */
function derivarEfast(c){
  const d = c.efast_ls_d, e = c.efast_ls_e;
  if(d || e){
    if(d==="Positivo" && e==="Positivo"){ c.efast_ls = "Positivo"; delete c.efast_ls_lado; }
    else if(d==="Negativo" || e==="Negativo"){
      c.efast_ls = "Negativo";
      c.efast_ls_lado = (d==="Negativo" && e==="Negativo") ? "Bilateral" : (d==="Negativo" ? "Direito" : "Esquerdo");
    }
    else if(d && e){ c.efast_ls = (d==="NR" && e==="NR") ? "Não realizado" : "Positivo"; delete c.efast_ls_lado; }
    else { delete c.efast_ls; delete c.efast_ls_lado; }      /* falta um lado */
  }
  const vals = FAST_JANELAS.map(j=>c[j[0]]);
  if(vals.some(Boolean)){
    const pos = FAST_JANELAS.filter(j=>c[j[0]]==="+").map(j=>j[1].toLowerCase());
    if(pos.length){ c.efast_global = "Positivo"; c.efast_janelas_pos = pos.join(", "); }
    else{
      delete c.efast_janelas_pos;
      if(vals.every(Boolean)) c.efast_global = vals.every(v=>v==="NR") ? "Não realizado" : "Negativo";
      else delete c.efast_global;                             /* janelas faltando */
    }
  }
}
function lsTexto(){
  const d = get("efast_ls_d"), e = get("efast_ls_e");
  if(!d && !e){
    const ls = get("efast_ls");                               /* casos antigos */
    if(ls==="Positivo") return "LS+ em todo tórax";
    if(ls==="Negativo") return "LS−";
    return "LS __";
  }
  if(d==="Positivo" && e==="Positivo") return "LS+ em todo tórax";
  const t = (v)=> v==="Positivo" ? "LS+" : (v==="Negativo" ? "LS−" : (v==="NR" ? "LS não avaliado" : "LS __"));
  return t(d)+" à direita e "+t(e)+" à esquerda";
}
/* exame que cada letra exige antes de poder ser NORMAL */
const EXAME_X = { b: ["efast_ls","Lung sliding dos dois hemitórax"], c: ["efast_global","FAST (as quatro janelas)"] };

function botoesLS(){
  let h = '<div class="fld"><label>Lung sliding (LS) — obrigatório</label>';
  LS_LADOS.forEach(([k,rot])=>{
    h += '<div class="fwin '+(get(k)==="Negativo"?"pos":"")+'"><span class="fwl">'+rot+'</span><div class="opts">'
       + [["Positivo","Positivo"],["Negativo","Negativo"],["NR","NR"]].map(([v,r])=>
           '<button class="opt '+(get(k)===v?"on"+(v==="Negativo"?" warn":""):"")+'" data-a="radio" data-k="'+k+'" data-v="'+v+'">'+r+'</button>').join("")
       + '</div></div>';
  });
  const bil = get("efast_ls_d")==="Positivo" && get("efast_ls_e")==="Positivo";
  h += '<button class="opt '+(bil?"on good":"")+'" data-a="lsbil" style="margin-top:6px">Bilateral — positivo em ambos'+(bil?" ✓":"")+'</button>';
  if(get("efast_ls")==="Negativo")
    h += '<div class="alert r">LS ausente '+({Bilateral:"bilateralmente",Direito:"à direita",Esquerdo:"à esquerda"}[get("efast_ls_lado")]||"")
       + ' — suspeitar de pneumotórax.</div>';
  return h + '</div>';
}
function botoesFAST(){
  let h = '<div class="fld"><label>FAST — janelas (obrigatório)</label>';
  FAST_JANELAS.forEach(([k,rot,sub])=>{
    h += '<div class="fwin '+(get(k)==="+"?"pos":"")+'"><span class="fwl">'+rot+(sub?'<small>'+sub+'</small>':'')+'</span><div class="opts">'
       + FAST_VALS.map(([v,r])=>'<button class="opt '+(get(k)===v?"on"+(v==="+"?" warn":""):"")+'" data-a="radio" data-k="'+k+'" data-v="'+v+'">'+r+'</button>').join("")
       + '</div></div>';
  });
  const pos = FAST_JANELAS.filter(j=>get(j[0])==="+");
  if(pos.length){
    const peri = get("fast_subxifoide")==="+";
    const abd = pos.filter(j=>j[0]!=="fast_subxifoide").map(j=>j[1].toLowerCase());
    if(abd.length) h += '<div class="alert r">FAST POSITIVO — líquido livre na janela '+abd.join(", ")+'. Suspeitar de sangramento ativo.</div>';
    if(peri) h += '<div class="alert r">Derrame pericárdico — suspeitar de tamponamento cardíaco.</div>';
  }else if(FAST_JANELAS.some(j=>!get(j[0])) && FAST_JANELAS.some(j=>get(j[0]))){
    h += '<div class="alert a">Faltam janelas: '+FAST_JANELAS.filter(j=>!get(j[0])).map(j=>j[1]).join(", ")+'.</div>';
  }
  return h + '</div>';
}

/* E-FAST-PLUS: diástase da sínfise púbica > 1,0 cm = pelve instável (livro aberto) */
function sinfiseCm(){ const v = parseFloat(String(get("efast_sinfise_cm")||"").replace(",",".")); return isNaN(v) ? null : v; }
function pelveInstavel(){ const v = sinfiseCm(); return v!==null && v>1.0; }
function botoesPlus(){
  const v = sinfiseCm(), inst = pelveInstavel();
  let h = '<div class="fld"><label>E-FAST-PLUS — sínfise púbica</label>'
        + '<div class="fwin '+(inst?"pos":"")+'"><span class="fwl">Distância da sínfise (cm)<small>&gt; 1,0 cm = pelve instável</small></span>'
        + '<div class="opts" style="align-items:center">'
        + '<input type="number" inputmode="decimal" step="0.1" min="0" data-k="efast_sinfise_cm" value="'+esc(get("efast_sinfise_cm")||"")+'" '
        + 'placeholder="ex.: 0,6" style="flex:1; min-width:90px; padding:10px; border:1.5px solid '+(inst?"var(--red)":"var(--line)")+'; border-radius:8px; font-size:17px; font-weight:700">'
        + '<button class="opt '+(get("efast_sinfise_cm")==="NR"?"on":"")+'" data-a="radio" data-k="efast_sinfise_cm" data-v="NR">NR</button>'
        + '</div></div>';
  if(inst) h += '<div class="alert r">Sínfise com '+String(v).replace(".",",")+' cm — fratura em livro aberto / pelve instável. '
             + 'Cinta pélvica e suspeitar de sangramento retroperitoneal.'+(v>2.5?' Acima de 2,5 cm sugere lesão ligamentar posterior.':'')+'</div>';
  else if(v!==null) h += '<div class="alert g">Sínfise com '+String(v).replace(".",",")+' cm — sem diástase.</div>';
  return h + '</div>';
}

/* LS− ou FAST+ tornam a letra ALTERADA sozinha, com o achado já escrito */
function sincronizarExameX(){
  const c = caso();
  derivarEfast(c);
  const vira = (L, texto)=>{
    delete c[L+"_normal"]; c[L+"_alt"] = true;
    /* só escreve se o campo está vazio ou ainda tem o texto que o próprio app pôs */
    if(!c[L+"_alterado"] || c[L+"_alterado"]===c["_auto_"+L]){ c[L+"_alterado"] = texto; c["_auto_"+L] = texto; }
  };
  /* achado corrigido: some o texto que o app escreveu (o digitado à mão fica) */
  const desfaz = L=>{ if(c["_auto_"+L] && c[L+"_alterado"]===c["_auto_"+L]){ delete c[L+"_alterado"]; delete c[L+"_alt"]; delete c["_auto_"+L]; } };
  if(c.efast_ls!=="Negativo") desfaz("b");
  if(c.efast_ls==="Negativo") vira("b", "E-FAST com LS negativo "+(c.efast_ls_lado==="Bilateral" ? "bilateralmente" : (c.efast_ls_lado==="Direito" ? "à direita" : "à esquerda"))+".");
  const partesC = [];
  if(c.efast_global==="Positivo") partesC.push("FAST positivo — janela "+(c.efast_janelas_pos||"")+".");
  if(pelveInstavel()) partesC.push("E-FAST-PLUS: sínfise púbica com "+String(sinfiseCm()).replace(".",",")+" cm — pelve instável (livro aberto).");
  if(partesC.length) vira("c", partesC.join(" ")); else desfaz("c");
  /* critério "fratura de pelve" do RABT acompanha a sínfise, sem desfazer marcação manual */
  if(pelveInstavel() && !c.rabt_pelve){ c.rabt_pelve = true; c._imp_pelve = true; }
  else if(!pelveInstavel() && c._imp_pelve){ delete c.rabt_pelve; delete c._imp_pelve; }
  salvar();
}

/* incoerências entre a letra marcada NORMAL e o que já foi registrado em outra aba */
function conflitoX(k){
  if(estadoX(k)!=="N") return "";
  if(k==="c" && get("efast_global")==="Positivo") return "FAST positivo registrado — C não deveria estar NORMAL.";
  if(k==="b" && get("efast_ls")==="Negativo") return "LS negativo registrado — B não deveria estar NORMAL.";
  if(k==="c" && pelveInstavel()) return "Sínfise > 1,0 cm registrada — C não deveria estar NORMAL.";
  if(k==="d" && gcsTotal()!==null && gcsTotal()<15) return "Glasgow "+gcsTotal()+" registrado — D não deveria estar NORMAL.";
  return "";
}

/* mecanismos combináveis (ex.: colisão auto + colisão moto) */
const MECANISMOS = ["Colisão auto","Colisão moto","Atropelamento","Queda","FAF","FAB","Agressão","Outro"];
const MEC_PENETRANTES = ["FAF","FAB"];
function slugMec(m){ return "_mec_"+normalizar(m).replace(/[^a-z0-9]+/g,"_"); }
function temPenetrante(){ const a=get("mecanismo"); return Array.isArray(a) && a.some(m=>MEC_PENETRANTES.indexOf(m)>=0); }
function mecanismoMisto(){ const a=get("mecanismo"); return Array.isArray(a) && temPenetrante() && a.some(m=>MEC_PENETRANTES.indexOf(m)<0 && m!=="Outro"); }

/* Alta velocidade: > 50 km/h para carro, > 32 km/h para moto */
const VEL_LIMITE = {"Colisão auto":50, "Colisão moto":32};
function velocidadeAlta(){
  const v = parseFloat(String(get("velocidade")||"").replace(",","."));
  if(!v) return null;                      /* sem velocidade informada: não decide */
  const mecs = Array.isArray(get("mecanismo")) ? get("mecanismo") : [];
  const lim = mecs.filter(m=>m in VEL_LIMITE).map(m=>VEL_LIMITE[m]);
  if(!lim.length) return null;             /* velocidade só vale para colisão auto/moto */
  return v > Math.min(...lim);             /* auto + moto: vale o limite da moto */
}
/* marca/desmarca o agravante sozinho; não mexe se alguém marcou à mão */
function aplicarVelocidade(){
  const c = caso(), alta = velocidadeAlta();
  const marcado = Array.isArray(c.agravantes) && c.agravantes.indexOf("Alta velocidade")>=0;
  if(alta===true && !marcado){ toggleMulti("agravantes","Alta velocidade"); c._imp_vel = true; salvar(); }
  else if(alta!==true && marcado && c._imp_vel){ toggleMulti("agravantes","Alta velocidade"); delete c._imp_vel; salvar(); }
}

/* Escala de Coma de Glasgow — descritores (Teasdale, revisão de 2014) */
const GCS = {
  gcs_o: ["Abertura ocular (O)", [
    ["4","Espontânea","olhos abertos sem estímulo"],
    ["3","Ao som","abre ao chamado ou a qualquer som"],
    ["2","À pressão","abre à pressão na ponta do dedo/trapézio"],
    ["1","Ausente","não abre, mesmo à pressão"]]],
  gcs_v: ["Resposta verbal (V)", [
    ["5","Orientada","diz nome, local e data corretamente"],
    ["4","Confusa","conversa, mas desorientada"],
    ["3","Palavras","palavras inteligíveis e inapropriadas"],
    ["2","Sons","gemidos, sons incompreensíveis"],
    ["1","Ausente","nenhuma resposta verbal"]]],
  gcs_m: ["Resposta motora (M)", [
    ["6","Obedece a comandos","executa ordem simples (ex.: mostrar 2 dedos)"],
    ["5","Localiza","leva a mão acima da clavícula até o estímulo"],
    ["4","Flexão normal","retirada rápida do membro ao estímulo"],
    ["3","Flexão anormal","decorticação — flexão lenta, estereotipada"],
    ["2","Extensão","descerebração — extensão dos membros"],
    ["1","Ausente","nenhum movimento"]]]
};
function fGcs(k){
  const [rot, itens] = GCS[k];
  let h = '<div class="fld"><label>'+rot+'</label><div class="gcs">';
  itens.forEach(([v,nome,desc])=>{
    h += '<button class="opt '+(get(k)===v?"on":"")+'" data-a="radio" data-k="'+k+'" data-v="'+v+'">'
       + '<b>'+v+'</b><span>'+nome+'<small>'+desc+'</small></span></button>';
  });
  return h + '</div></div>';
}
function gcsGravidade(g){ return g<=8 ? "grave — considerar via aérea definitiva" : (g<=12 ? "moderado" : "leve"); }

/* ácido tranexâmico — esquemas do serviço */
const ATX_ESQUEMAS = ["1 g IV em 10 min + 1 g IV em dripping","2 g IV em bolus","1 g IV em bolus","Outro"];
const ATX_LEGADO = {"1 g em 10 min + 1 g em 8 h":"1 g IV em 10 min + 1 g IV em dripping",
                    "2 g em bolus único":"2 g IV em bolus","1 g dose única":"1 g IV em bolus"};

/* cálcio: 1 ampola para cada 2 concentrados de hemácias */
const CALCIO_TIPOS = ["Cloreto de cálcio 10% (preferencial)","Gluconato de cálcio 10% (na falta do cloreto)"];
function calcioIndicado(){ const ch = parseInt(get("t_ch"),10); return ch>0 ? Math.floor(ch/2) : 0; }
function blocoCalcio(){
  const ch = parseInt(get("t_ch"),10) || 0, ind = calcioIndicado(), feito = parseInt(get("calcio_ampolas"),10) || 0;
  let h = '<div class="box" style="margin-top:10px">'
        + '<div class="boxt">Reposição de cálcio</div>'
        + '<p class="hint" style="margin:0 0 8px">Para cada <b>2 concentrados de hemácias</b>, <b>1 ampola de cloreto de cálcio 10%</b> (preferencial). '
        + 'Na ausência, gluconato de cálcio 10% — atenção: 1 ampola de cloreto ≈ 3 de gluconato em cálcio elementar.</p>'
        + fRadio("calcio_tipo","Sal utilizado",CALCIO_TIPOS)
        + '<div class="grid g2" style="margin-top:8px">'+fTexto("calcio_ampolas","Ampolas feitas","","number")+'</div>';
  if(ch>=2){
    const ok = feito>=ind;
    h += '<div class="alert '+(ok?"g":"a")+'">'+ch+' hemácia'+(ch===1?"":"s")+' → '+ind+' ampola'+(ind===1?"":"s")+' de cálcio indicada'+(ind===1?"":"s")
       + ' · feita'+(feito===1?"":"s")+': '+feito+(ok?" ✓":" — faltam "+(ind-feito))+'</div>';
  }else if(get("ptm")==="Acionado"){
    h += '<div class="alert a">PTM acionado: registre as hemácias abaixo para calcular o cálcio.</div>';
  }
  return h + '</div>';
}

/* ---------- Indicações de tomografia ----------
   Cada item: [rótulo, função que detecta sozinho a partir da ficha (ou null = só manual)].
   Item detectado aparece marcado "(auto)"; os demais são marcados à mão. */
function num(k){ const v = parseFloat(String(get(k)||"").replace(",",".")); return isNaN(v) ? null : v; }
function algumVital(ks, teste){ return ks.some(k=>{ const v=num(k); return v!==null && teste(v); }); }
function temMec(m){ return tem("mecanismo",m); }
const TCCI_GRUPOS = [
  ["Mecanismo", [
    ["Pedestre ou ciclista atropelado a qualquer velocidade", ()=>temMec("Atropelamento")],
    ["Colisão de moto ou carro > 50 km/h", ()=>(temMec("Colisão auto")||temMec("Colisão moto")) && (num("velocidade")||0)>50],
    ["Capotamento de carro ou ejeção do veículo", ()=>tem("agravantes","Ejeção")],
    ["Morte de outro passageiro", ()=>tem("agravantes","Óbito no local")],
    ["Queda de altura desconhecida ou > 3 m", ()=>temMec("Queda") && (num("queda_altura")||0)>3],
    ["Explosão", null],
    ["Compressão torácica", null],
    ["Circunstâncias desconhecidas", null]]],
  ["Sinais vitais iniciais", [
    ["Glasgow < 10", ()=>{ const g=gcsTotal(); return (g!==null && g<10) || algumVital(["cena_gcs"], v=>v<10); }],
    ["PAS < 80 mmHg", ()=>algumVital(["cena_pas","adm_pas"], v=>v<80)],
    ["FR < 10 ou > 29 irpm", ()=>algumVital(["cena_fr","adm_fr"], v=>v<10||v>29)],
    ["SatO2 < 90% (ou < 85% acima de 75 anos)", ()=>{ const lim=(num("idade")||0)>75?85:90; return algumVital(["cena_spo2","adm_spo2"], v=>v<lim); }]]],
  ["Padrão de lesão", [
    ["Tórax instável", null],
    ["Instabilidade de anel pélvico", ()=>pelveInstavel() || !!get("rabt_pelve")],
    ["Fratura de mais de 1 osso longo", null],
    ["Amputação proximal", null]]]
];
const TCSEG_GRUPOS = [
  ["Crânio / cervical", [
    ["Glasgow < 15", ()=>{ const g=gcsTotal(); return g!==null && g<15; }],
    ["Idade < 5 ou > 60 anos", ()=>{ const i=num("idade"); return i!==null && (i<5 || i>60); }],
    ["Distúrbio de coagulação / anticoagulante", ()=>get("anticoag")==="Sim"],
    ["Amnésia", null]]],
  ["Tórax (alteração no RX de entrada)", [
    ["Alargamento de mediastino", null],
    ["Fratura de clavícula", null],

function normalizarCaso(c){
  /* casos antigos: _uid determinístico, para o mesmo caso nunca virar dois */
  if(!c._uid) c._uid = (c.id||c._criado) ? "legado-"+(c.id||"")+"-"+(c._criado||"") : uid();
  if(!c._atualizado) c._atualizado = c._criado || agoraISO();
  if(c.efast_ls && !c.efast_ls_d && !c.efast_ls_e){
    if(c.efast_ls==="Positivo"){ c.efast_ls_d = c.efast_ls_e = "Positivo"; }

      if(c.efast_ls_lado!=="Esquerdo") c.efast_ls_d = "Negativo";

  if(typeof c.mecanismo==="string") c.mecanismo = [c.mecanismo];
  if(Array.isArray(c.mecanismo)) c.mecanismo = c.mecanismo.map(m=> m==="Moto" ? "Colisão moto" : m);
  return c;
}
/* união por _uid: vence a versão editada por último */
function mesclar(a, b){
  const m = new Map();
  a.concat(b||[]).forEach(c=>{
    if(!c || typeof c!=="object") return;
    normalizarCaso(c);
    const x = m.get(c._uid);
    if(!x || String(c._atualizado) > String(x._atualizado)) m.set(c._uid, c);
  });
  return [...m.values()].sort((x,y)=>String(y._criado||"").localeCompare(String(x._criado||"")));
}

function agoraHM(){ const d=new Date(); return dois(d.getHours())+":"+dois(d.getMinutes()); }

function toggleMulti(k,v){
  const c=caso(); const arr = Array.isArray(c[k])? c[k].slice():[];
  const i = arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v);

function tem(k,v){ const a=get(k); return Array.isArray(a) && a.indexOf(v)>=0; }

/* minutos entre dois "HH:MM" — assume mesmo dia ou virada de meia-noite */
function difMin(a,b){
  if(!a||!b||a==="NA"||b==="NA") return null;
  const pa=a.split(":"), pb=b.split(":");
  if(pa.length<2||pb.length<2) return null;
  let ma=(+pa[0])*60+(+pa[1]), mb=(+pb[0])*60+(+pb[1]);
  let d=mb-ma; if(d < -720) d+=1440;   // virada de meia-noite
  return d;
}

/* ---------- RABT (Revised Assessment of Bleeding and Transfusion) ----------
   4 critérios: ferimento penetrante EM TORSO · FAST positivo · Shock Index > 1,0 ·
   fratura de pelve (suspeita ou confirmada). RABT ≥ 2 → acionar PTM.
   Não confundir com o ABC score, que usa PAS ≤ 90 e FC ≥ 120 no lugar do SI. */
/* torso = tórax, abdome, flanco, dorso ou pelve. Penetrante em membro, cabeça ou pescoço não pontua. */
const TORSO_TXT = "tórax, abdome, flanco, dorso ou pelve";
/* basta marcar "ferimento penetrante em torso"; só não vale se a Cena registrou trauma contuso */
function cenaContusa(){ return get("mecanismo_tipo")==="Contuso" && !temPenetrante(); }

       + '</div>';
}

  if(d===null) return null;
  if(d<0) d += 1440;             // consulta no dia seguinte: não reportar minutos negativos
  return d;
}

/* ---------- RTS (Revised Trauma Score) ----------
   Valores codificados de Champion et al. Cada componente vale 0 a 4.
   T-RTS = soma simples (0 a 12), usado em triagem.
   RTS ponderado = 0,9368·GCS + 0,7326·PAS + 0,2908·FR (0 a 7,8408), usado no TRISS.
   Usar sempre a PRIMEIRA aferição, antes de qualquer reposição.            */
function rtsCodificado(){
  const g = gcsTotal();
  const pasRaw = get("adm_pas"), frRaw = get("adm_fr");
  const pas = +pasRaw, fr = +frRaw;
  const cg = (g===null) ? null : (g>=13?4 : g>=9?3 : g>=6?2 : g>=4?1 : 0);
  const cp = (pasRaw===undefined||pasRaw===""||isNaN(pas)) ? null
           : (pas>89?4 : pas>=76?3 : pas>=50?2 : pas>=1?1 : 0);
  const cr = (frRaw===undefined||frRaw===""||isNaN(fr)) ? null
           : ((fr>=10&&fr<=29)?4 : fr>29?3 : fr>=6?2 : fr>=1?1 : 0);
  return {cg,cp,cr};
}
function rtsT(){
  const {cg,cp,cr} = rtsCodificado();
  if(cg===null||cp===null||cr===null) return null;
  return cg+cp+cr;
}
function rtsW(){
  const {cg,cp,cr} = rtsCodificado();
  if(cg===null||cp===null||cr===null) return null;
  return Math.round((0.9368*cg + 0.7326*cp + 0.2908*cr)*10000)/10000;
}

/* ---------- ISS (Injury Severity Score) ----------
   Soma dos quadrados dos três maiores AIS entre as seis regiões.
   Qualquer região com AIS 6 (lesão não sobrevivível) força ISS = 75.   */
function issRegioesPreenchidas(){
  return AIS_REGIOES.filter(([k])=> get(k)!==undefined && get(k)!=="").length;
}
function iss(){
  if(issRegioesPreenchidas()===0) return null;
  const v = AIS_REGIOES.map(([k])=>{ const x=+get(k); return isNaN(x)?0:x; });
  if(v.some(x=>x===6)) return 75;
  const top3 = v.slice().sort((a,b)=>b-a).slice(0,3);
  return top3.reduce((s,x)=>s+x*x,0);
}

/* ---------- TRISS (probabilidade de sobrevida) ----------
   Ps = 1 / (1 + e^-b),  b = b0 + b1·RTS + b2·ISS + b3·índice de idade
   Coeficientes do MTOS (Boyd, 1987). Índice de idade: 0 se < 55 anos, 1 se ≥ 55.
   Convenção: menores de 15 anos usam os coeficientes de trauma contuso.   */
/* Tipo de trauma: fonte única para RABT e TRISS.
   Prioridade: campo "Tipo de trauma" da Cena → mecanismo FAF/FAB → marcação manual. */
function ehPenetrante(){
  if(get("mecanismo_tipo")) return get("mecanismo_tipo")==="Penetrante";
  if(temPenetrante()) return true;
  return !!get("rabt_penetrante");
}
function trissPenetrante(){
  const idade = +get("idade");
  if(idade && idade<15) return false;
  const manual = get("triss_mecanismo");
  if(manual) return manual==="Penetrante";
  return ehPenetrante();
}
function triss(){
  const r = rtsW(), i = iss(), idade = +get("idade");
  if(r===null || i===null || !idade) return null;
  const pen = trissPenetrante();
  const c = pen ? {b0:-0.6029, b1:1.1430, b2:-0.1516, b3:-2.6676}
                : {b0:-1.2470, b1:0.9544, b2:-0.0768, b3:-1.9052};
  const b = c.b0 + c.b1*r + c.b2*i + c.b3*(idade>=55?1:0);
  return Math.round((1/(1+Math.exp(-b)))*1000)/10;   // em %
}

/* ============================ PARSER iMIST-AMBO v2  ============================
   Ajustado ao formato do protocolo PS CG HSP: blocos rotulados (# ID, # IMISTTT AMBO,
   # XABCDE), linhas i/M/I/S/T/T/T/A/M/B/O e X/A/B/C/D/E, abreviacoes do servico
   (CC+PR, COBOM, SatO2 em AA, Glasgow (O:V:M), FAST (-)).
   Preenche APENAS campos vazios. Remove nome e numero de AT do texto guardado.   */
let PARSE_MSG = "";

function normalizar(x){ return x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

/* remove identificadores do texto que fica gravado no aparelho */
function redigirIdentificacao(raw){
  let mudou = false;
  const linhas = raw.split(/\n/);
  let sec = "";
  const out = linhas.map(l=>{
    const low = normalizar(l);
    if(/^\s*#/.test(l)){
      sec = low;
      if(/\bid\b/.test(low) && /\d{1,3}\s*anos/.test(low)){
        mudou = true;
        const idade=(low.match(/(\d{1,3})\s*anos/)||[])[1];
        return "# ID: [identificacao removida]"+(idade?" — "+idade+" anos":"");
      }
      return l;
    }
    const temAT = /\bat\s*:?\s*\d{5,}/i.test(l);
    const linhaIdNome = /\bid\b/.test(sec) && /\d{1,3}\s*anos/.test(low) && /[a-z]{3,}\s+[a-z]{3,}/.test(low);
    if(temAT || linhaIdNome){
      mudou = true;
      const idade=(low.match(/(\d{1,3})\s*anos/)||[])[1];
      return "- [identificacao removida]"+(idade?" — "+idade+" anos":"");
    }
    return l;
  });
  return { texto: out.join("\n"), mudou };
}

function parseAPH(){
  const bruto = get("aph_texto")||"";
  if(!bruto.trim()){ PARSE_MSG="Cole o texto da passagem antes."; return; }

  const red = redigirIdentificacao(bruto);
  if(red.mudou) set("aph_texto", red.texto);
  const raw = red.texto;

  const feitos = [];
  const vazio = k => get(k)===undefined || get(k)==="";
  const poe = (k,v,rot)=>{ if(v!==undefined && v!=="" && vazio(k)){ set(k,v); if(rot) feitos.push(rot); } };
  const marca = (k,v,rot)=>{ if(!tem(k,v)){ toggleMulti(k,v); if(rot) feitos.push(rot); } };

  /* ---------- utilitarios de extracao ---------- */
  const rxPA   = /\bpa\b\D{0,3}(\d{2,3})\s*[x\/]\s*(\d{2,3})/;
  const rxFC   = /\bfc\b\D{0,3}(\d{2,3})/;
  const rxFR   = /\bfr\b\D{0,3}(\d{1,2})\b/;
  const rxSAT  = /(?:sato2|spo2|so2|sat\s*o2|satura\w*)\D{0,4}(\d{2,3})/;
  const rxGCS  = /(?:glasgow|\bgcs\b|\becg\b)\D{0,4}(\d{1,2})/;
  const rxOVM  = /\bo\s*:?\s*(\d)\D{0,4}v\s*:?\s*(\d)\D{0,4}m\s*:?\s*(\d)/;

  function vitaisCena(t){
    let m;
    if(m=t.match(rxPA)){ poe("cena_pas",m[1],"PA cena "+m[1]+"x"+m[2]); poe("cena_pad",m[2]); }
    if(m=t.match(rxFC))  poe("cena_fc",m[1],"FC cena "+m[1]);
    if(m=t.match(rxFR))  poe("cena_fr",m[1],"FR cena "+m[1]);
    if(m=t.match(rxSAT)) poe("cena_spo2",m[1],"SatO2 cena "+m[1]);
    if(m=t.match(rxGCS)) poe("cena_gcs",m[1],"Glasgow cena "+m[1]);
  }
  function identificacao(t){
    let m;
    if(m=t.match(/(\d{1,3})\s*anos/)) poe("idade",m[1],"idade "+m[1]);
    if(/masculin|\bhomem\b/.test(t)) poe("sexo","M","sexo M");
    else if(/feminin|\bmulher\b/.test(t)) poe("sexo","F","sexo F");
    if(m=t.match(/(\d{2,3})\s*kg/)) poe("peso",m[1],"peso "+m[1]+" kg");
  }
  function mecanismo(t, original){
    let m;
    /* marca todos os mecanismos citados, não só o primeiro */
    const achados=[];
    if(/atropel/.test(t)) achados.push("Atropelamento");   /* pedestre: o veículo citado não é mecanismo à parte */
    else{
      const moto = /\bmoto\b|motocicl|motociclista/.test(t);
      if(moto) achados.push("Colisão moto");
      if(/automovel|\bauto\b|\bcarro\b|veicul|capot|caminh|onibus/.test(t) || (/colis|abalroa|capot/.test(t) && !moto))
        achados.push("Colisão auto");
    }
    /* "queda de moto" é acidente de moto, não queda de altura */
    if(/queda/.test(t.replace(/queda (d[aoe]s? )?(propria )?(moto\w*|bicicleta|bike)/g,""))) achados.push("Queda");
    if(/\bfaf\b|arma de fogo|balead|\btiro\b|\bpaf\b/.test(t)) achados.push("FAF");
    if(/\bfab\b|arma branca|facada|esfaquead/.test(t)) achados.push("FAB");
    if(/agress|espancad/.test(t)) achados.push("Agressão");
    achados.forEach(v=> marca("mecanismo",v,"mecanismo "+v));
    if(!achados.length && original.trim()){
      marca("mecanismo","Outro","mecanismo Outro");
      poe("mecanismo_outro", original.trim(), "descrição: "+original.trim().slice(0,40));
    }
    if(/\bfaf\b|arma de fogo|balead|\btiro\b|\bfab\b|arma branca|facada|esfaquead|penetrante/.test(t))
      poe("mecanismo_tipo","Penetrante","tipo penetrante");
    else poe("mecanismo_tipo","Contuso","tipo contuso");
    if(tem("mecanismo","Queda") && (m=t.match(/(\d+(?:[.,]\d+)?)\s*m(?:etros)?\b/)))
      poe("queda_altura",m[1].replace(",","."),"altura "+m[1]+" m");
    const agg=[[/ejetad|ejecao/,"Ejeção"],[/obito no local|morte no local/,"Óbito no local"],
      [/encarcerad/,"Encarceramento"],[/sem capacete|sem cinto/,"Sem cinto/capacete"],[/alta velocidade/,"Alta velocidade"]];
    for(const [re,val] of agg){ if(re.test(t)) marca("agravantes",val,"agravante: "+val); }
    if(m=t.match(/(\d{2,3})\s*km\s*\/?\s*h/)){ poe("velocidade",m[1],"velocidade "+m[1]+" km/h"); aplicarVelocidade(); }
  }
  function transporte(t){
    if(/samu/.test(t)) poe("transporte","SAMU","transporte SAMU");
    else if(/bombeiro|cobom/.test(t)) poe("transporte","Bombeiros","transporte Bombeiros");
    else if(/\bgrau\b/.test(t)) poe("transporte","GRAU","transporte GRAU");
    else if(/proprio/.test(t)) poe("transporte","Próprios meios","meios próprios");
    else poe("transporte","Outro serviço","transporte: outro serviço");
  }
  function tratamento(t){
    let m;
    if(/\bcc\b|colar/.test(t)) marca("aph_fez","Colar cervical","APH: colar");
    if(/\bpr\b|prancha/.test(t)) marca("aph_fez","Prancha","APH: prancha");
    if(/torniquete/.test(t)) marca("aph_fez","Torniquete","APH: torniquete");
    if(/tranexamico|transamin|\btxa\b|\batx\b/.test(t)) marca("aph_fez","Ácido tranexâmico","APH: tranexâmico");
    if(/\biot\b|intubad/.test(t)) marca("aph_fez","IOT","APH: IOT");
    if(/hemocomponente|concentrado de hemacia|sangue total/.test(t)) marca("aph_fez","Hemocomponente","APH: hemocomponente");
    if(m=t.match(/(\d{3,4})\s*ml\b/)){ marca("aph_fez","Volume","APH: volume"); poe("aph_volume",m[1],"volume "+m[1]+" mL"); }
  }
  function ambo(letra,t,original){
    if(letra==="a"){ if(/nega/.test(t)) poe("alergia","Nega","alergia: nega"); }
    if(letra==="m"){
      const m=t.match(/varfarina|marevan|rivaroxabana|xarelto|apixabana|eliquis|dabigatrana|pradaxa|clopidogrel|\baas\b/);
      if(m){ poe("anticoag","Sim","anticoagulante: sim"); poe("anticoag_qual",m[0],"droga: "+m[0]); }
      else if(/nega|nao informado/.test(t)===false && t.trim()) poe("comorbidades_meds_nota",undefined);
    }
    if(letra==="b"){ if(/nega/.test(t)) poe("comorbidades","Nega","antecedentes: nega"); }
  }
  /* X-ABCDE em tres estados: normal (frase-assinatura do servico presente),
     alterado (achado transcrito para o campo "alterado"), ou indeterminado —
     que vira PENDENCIA para exame e preenchimento manual.                    */
  function xabcde(letra, t, orig){
    let m;
    const setAlt  = ()=>{ poe(letra+"_alterado", orig.trim(), letra.toUpperCase()+" alterado (transcrito)"); };
    const setNorm = ()=>{ poe(letra+"_normal", true, letra.toUpperCase()+" normal"); };

    if(letra==="x"){
      if(/sem sangramento ameacador/.test(t)) setNorm();
      else if(orig.trim().length>8) setAlt();
      return;
    }
    if(letra==="a"){
      const ta = t.replace(/sem desvio de traqueia/g," ").replace(/sem (sinais? de )?fuligem[^,.;]*/g," ").replace(/sem sangue em cavidade[^,.;]*/g," ");
      const alt = /mascara laringea|\biot\b|intubad|crico|obstru|estridor|fuligem|sangue em cavidade|ventilacao nao efetiva|desvio de traqueia/.test(ta);
      if(alt) setAlt();
      else if(/via aerea pervia/.test(t)) setNorm();
      return;
    }
    if(letra==="b"){
      if(m=t.match(rxFR))  poe("adm_fr",m[1],"FR admissão "+m[1]);
      if(m=t.match(rxSAT)) poe("adm_spo2",m[1],"SatO2 admissão "+m[1]);
      if(/\bls\s*\+\s*(em todo torax|bilateral)|ls positivo bilateral/.test(t)){
        poe("efast_ls_d","Positivo","LS+ à direita"); poe("efast_ls_e","Positivo","LS+ à esquerda"); derivarEfast(caso());
      }
      const tb = t.replace(/sem enfisema[^,.;]*/g," ");
      const alt = /puncao|dreno|pneumotorax|hemotorax|hipofonese|abolid|assimetr|instabil|flictena|crepita|ventilacao nao efetiva|queimadura|enfisema/.test(tb);
      if(alt) setAlt();
      else if(/expansibilidade.{0,25}simetrica/.test(t)) setNorm();
      return;
    }
    if(letra==="c"){
      if(m=t.match(rxPA)){ poe("adm_pas",m[1],"PA admissão "+m[1]+"x"+m[2]); poe("adm_pad",m[2]); }
      if(m=t.match(rxFC))  poe("adm_fc",m[1],"FC admissão "+m[1]);
      if(/\bfast\b\s*(?:\(?\s*-\s*\)?|negativo)/.test(t)) poe("efast_global","Negativo","FAST negativo");
      else if(/\bfast\b\s*(?:\(?\s*\+\s*\)?|positivo)/.test(t)) poe("efast_global","Positivo","FAST positivo");
      const tc = t.replace(/sem dor a palpacao[^,.;]*/g," ").replace(/impossibilidade de avaliar[^,.;]*/g," ");
      const alt = /inaudivel|instavel|tec\s*>\s*3|hipotens|choque|dor a palpacao/.test(tc);
      if(alt) setAlt();
      else if(/sem dor a palpacao abdominal/.test(t) && /pelve estavel/.test(t)) setNorm();
      return;
    }
    if(letra==="d"){
      if(m=t.match(rxOVM)){ poe("gcs_o",m[1],"Glasgow O"+m[1]+"V"+m[2]+"M"+m[3]); poe("gcs_v",m[2]); poe("gcs_m",m[3]); }
      const alt = /midriatic|anisocor|nao fotorreagent|deficit focal(?! *ausente)|glasgow\s*[3-8]\b|\becg\s*[3-8]\b/.test(t.replace(/sem deficits? focais?/g," "));
      if(alt) setAlt();
      else if(/isocoric/.test(t) && /fotorreagent/.test(t)) setNorm();
      return;
    }
    if(letra==="e"){
      const te = t.replace(/sem lesoes[^,.;]*/g," ").replace(/sem desalinhamento/g," ");
      const alt = /lesao|lesoes|escoriac|queimadura|flictena|fratura|ferimento|hematoma|deform|amputa|desalinhamento/.test(te);
      if(alt) setAlt();
      else if(/dorso sem desalinhamento/.test(t)) setNorm();
      return;
    }
  }

  /* ---------- varredura linha a linha, com secoes ---------- */
  const linhas = raw.split(/\n/);
  let sec = "imist";
  let iVistos = 0, tVistos = 0, temRotulo = false;

  for(const linhaOrig of linhas){
    const L = linhaOrig.trim();
    if(!L) continue;
    const low = normalizar(L);

    if(/^#/.test(low)){
      if(low.includes("xabcde")) sec="xabcde";
      else if(low.includes("imist")) sec="imist";
      else if(low.includes("conduta")) sec="conduta";
      else if(low.includes("protocolo")) sec="prot";
      else if(low.includes("exame")) sec="exames";
      else if(/#\s*id\b/.test(low)) sec="id";
      else if(/#\s*hd\b/.test(low)) sec="hd";
      else sec="outra";
      if(sec==="id") identificacao(low);
      continue;
    }
    /* mudanca de bloco sem cabecalho "#": comum nas notas reais */
    if(/^protocolo\s+trauma/.test(low)){ sec="prot"; continue; }
    if(/^imist/.test(low)){ sec="imist"; continue; }
    if(/^xabcde/.test(low)){ sec="xabcde"; continue; }

    const rot = L.match(/^([A-Za-z])\s*:\s*(.*)$/);

    /* linha rotulada i/M/S/T fora do XABCDE puxa a leitura para o modo iMIST,
       mesmo que o cabecalho do bloco nao exista na nota */
    if(rot && sec!=="xabcde" && sec!=="imist"){
      const l0 = normalizar(rot[1]);
      if(l0==="i"||l0==="m"||l0==="s"||l0==="t") sec="imist";
    }

    if(sec==="conduta"||sec==="prot"||sec==="exames") continue;
    if(sec==="id"||sec==="hd"){ identificacao(low); continue; }
    if(!rot){ if(sec==="imist") vitaisCena(low); continue; }
    temRotulo = true;
    const letra = normalizar(rot[1]);
    const contLow = normalizar(rot[2]);
    const contOrig = rot[2];

    /* X: liga o modo XABCDE mesmo sem cabecalho */
    if(letra==="x") sec="xabcde";

    if(sec==="xabcde"){ xabcde(letra, contLow, contOrig); continue; }

    /* secao iMIST-AMBO */
    if(letra==="i"){
      iVistos++;
      if(/masculin|feminin|\bhomem\b|\bmulher\b|\bsexo\b|\d{1,3}\s*anos/.test(contLow) && iVistos===1) identificacao(contLow);
      else poe("injurias", contOrig, "injúrias registradas");
      continue;
    }
    if(letra==="m"){ if(sec==="imist" && !/^\s*(nega|nao informado|-)\s*$/.test(contLow) && get("mecanismo")===undefined && !get("anticoag") && !/varfarina|xarelto|rivaroxabana|apixabana|eliquis|clopidogrel|\baas\b|mg\b|mcg\b|ampola/.test(contLow)) { mecanismo(contLow, contOrig); } else { ambo("m", contLow, contOrig); } continue; }
    if(letra==="s"){ vitaisCena(contLow); continue; }
    if(letra==="t"){
      tVistos++;
      if(/samu|bombeiro|cobom|\bgrau\b|resgate|aeromedic|helicopter|proprio|particular/.test(contLow)) transporte(contLow);
      else if(/^\s*~?\s*\d+\s*(min|h\b|hora)/.test(contLow)) poe("aph_tempo", contOrig.trim(), "tempo de transporte "+contOrig.trim());
      else tratamento(contLow);
      continue;
    }
    if(letra==="a"||letra==="b"||letra==="o"){ ambo(letra, contLow, contOrig); continue; }
  }

  /* fallback: texto corrido sem rotulos */
  if(!temRotulo){
    const t = " "+normalizar(raw)+" ";
    identificacao(t); mecanismo(t, ""); vitaisCena(t); transporte(t); tratamento(t);
    if(/nega alergia|sem alergia/.test(t)) poe("alergia","Nega","alergia: nega");
  }

  /* pendencias: letras sem normal e sem alterado apos a leitura */
  const pend = [];
  ["x","a","b","c","d","e"].forEach(k=>{
    if(!get(k+"_normal") && vazio(k+"_alterado")) pend.push(k.toUpperCase());
  });
  if(pend.length) set("xabcde_pend", pend); else set("xabcde_pend", undefined);

  const itens = feitos.filter(Boolean);
  PARSE_MSG = (red.mudou ? "<b>Nome e nº de atendimento removidos do texto</b> — sem identificadores neste aparelho. " : "")
    + (itens.length
       ? "Preenchi "+itens.length+" itens: "+itens.join(" · ")+". "
       : "Não reconheci nada preenchível no texto. ")
    + (pend.length ? "<b>Pendências no X-ABCDE: "+pend.join(", ")+"</b> — não constavam na passagem; examinar e preencher na aba X-ABCDE. " : "")
    + "<b>Confira cada campo — a responsabilidade é de quem assina.</b>";
}

/* aspas ou "<" digitados não podem quebrar o campo ao redesenhar */
function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* --- componentes --- */
function fTexto(k,label,ph,tipo){
  return '<div class="fld"><label>'+label+'</label><input type="'+(tipo||"text")+'" data-k="'+k+'" '
       + (tipo==="number"?'inputmode="decimal" ':'') + 'value="'+esc(get(k)||"")+'" placeholder="'+(ph||"")+'"></div>';
}
function fArea(k,label,ph){
  return '<div class="fld"><label>'+label+'</label><textarea data-k="'+k+'" placeholder="'+(ph||"")+'">'+esc(get(k)||"")+'</textarea></div>';
}
function fRadio(k,label,vals,estilo){
  let h='<div class="fld"><label>'+label+'</label><div class="opts">';
  vals.forEach(v=>{
    const on = get(k)===v;
    h += '<button class="opt '+(on?"on":"")+' '+(estilo||"")+'" data-a="radio" data-k="'+k+'" data-v="'+v+'">'+v+'</button>';
  });
  h+='</div></div>';
  return h;
}
function fMulti(k,label,vals){
  let h='<div class="fld"><label>'+label+'</label><div class="opts">';
  vals.forEach(v=>{
    h += '<button class="opt '+(tem(k,v)?"on":"")+'" data-a="multi" data-k="'+k+'" data-v="'+v+'">'+v+'</button>';
  });
  h+='</div></div>';
  return h;
}
function fBool(k,label,estilo){
  const on = !!get(k);
  return '<button class="opt '+(on?"on "+(estilo||""):"")+'" data-a="bool" data-k="'+k+'">'+label+'</button>';
}

/* --- 1 · horários --- */
function secHorarios(){
  let h='<div class="sec"><h2>Relógio do atendimento</h2>'
   + '<p class="hint" style="margin:-4px 0 12px">Só o <b>Trauma</b> é digitado (horário informado pelo APH). A <b>Porta</b> é gravada ao abrir o caso. '
   + 'Os demais: toque no cartão no instante em que acontece — o relógio do aparelho registra sozinho. '
   + 'N/A marca o que não se aplica, diferente de deixar vazio.</p><div class="clock">';
  HORARIOS.forEach(([k,rot])=>{
    const v = get(k);
    const na = v==="NA";
    if(k==="h_trauma"){
      h += '<div class="tcard '+(v&&!na?"set":"")+' '+(na?"na":"")+'">'
         + '<div class="tl">'+rot+'</div>'
         + (na ? '<div class="tv">N/A</div>'
               : '<input type="time" data-k="h_trauma" value="'+esc(v||"")+'">')
         + '<div class="trow"><button class="tsm" style="flex:1" data-a="na" data-k="'+k+'">'+(na?"Informar horário":"Desconhecido")+'</button></div>'
         + '</div>';
      return;
    }
    if(!v){
      /* cartão inteiro é o botão: um toque grava a hora */
      h += '<div><button class="tcard" data-a="agora" data-k="'+k+'">'
         + '<div class="tl">'+rot+'</div><div class="tv">TOCAR</div>'
         + '<div class="tsub">registra a hora atual</div></button>'
         + '<div style="margin:-4px 0 0; text-align:center"><button class="tsm" data-a="na" data-k="'+k+'" style="padding:5px 10px; font-size:12px; min-height:34px; margin-top:8px">N/A</button></div></div>';
      return;
    }
    const ts = get("_ts_"+k);
    const seg = ts ? new Date(ts).toLocaleTimeString("pt-BR") : "";
    h += '<div class="tcard lock '+(na?"na":"set")+'">'
       + '<div class="tl">'+rot+'</div>'
       + '<div class="tv">'+(na?"N/A":v)+'</div>'
       + '<div class="tsub">'+(seg?"registrado "+seg:"")+'</div>'
       + '<div class="trow"><button class="tsm" style="flex:1" data-a="limpar" data-k="'+k+'">desfazer</button></div>'
       + '</div>';
  });
  h+='</div>';

  const dTP = difMin(get("h_trauma"), get("h_porta"));
  if(dTP!==null && dTP<0) h += '<div class="alert a" style="margin-top:12px">Horário do trauma está depois da chegada — confira o que o APH informou.</div>';

  // intervalos calculados
  const pares = [["h_porta","h_tc","Porta → TC"],["h_porta","h_transf","Porta → 1ª transfusão"],
                 ["h_porta","h_cc","Porta → centro cirúrgico"],["h_porta","h_saida","Tempo na sala"],
                 ["h_trauma","h_atx","Trauma → tranexâmico"]];
  let its="";
  pares.forEach(([a,b,rot])=>{
    const d = difMin(get(a),get(b));
    if(d!==null && d>=0) its += '<div class="opt" style="pointer-events:none">'+rot+': <b style="margin-left:6px">'+d+' min</b></div>';
  });
  if(its) h += '<div style="margin-top:14px"><label style="font-size:13px; font-weight:600; color:var(--mut)">Intervalos</label><div class="opts" style="margin-top:6px">'+its+'</div></div>';

  const jan = janelaATX();
  if(jan!==null && !get("h_atx")){
    if(jan>180) h += '<div class="alert a">Janela do ácido tranexâmico ultrapassada — '+jan+' min desde o trauma. Registre o motivo em Hemostasia.</div>';
    else h += '<div class="alert g">Dentro da janela do ácido tranexâmico — '+jan+' min desde o trauma ('+(180-jan)+' min restantes).</div>';
  }
  h+='</div>';
  return h;
}

/* --- 4 · XABCDE --- */
/* estado de cada letra: "N" normal, "A" alterado, "" não avaliado */
function estadoX(k){
  if(get(k+"_normal")) return "N";
  if(get(k+"_alt") || get(k+"_alterado")) return "A";
  return "";
}
function secXabcde(){
  let h='<div class="sec"><h2>X-ABCDE — registro por exceção</h2>'
   + '<p class="hint" style="margin:-4px 0 12px">NORMAL = a frase-padrão descreve o paciente (valores em negrito vêm da Admissão e do FAST). '
   + 'Se algo fugiu do padrão, escreva no campo da letra — ela vira ALTERADO sozinha.</p>';
  XABCDE.forEach(([L,k,frase,intervs])=>{
    const st = estadoX(k);
    h += '<div class="xrow '+(st==="A"?"alt":(st==="N"?"ok":""))+'">'
       + '<div class="xhead"><div class="xltr">'+L+'</div>'
       + '<div class="xnorm">'+fraseX(frase)+'</div>'
       + ((!st && tem("xabcde_pend",L))
          ? '<span class="pend">PENDENTE</span>'
          : '')
       + '<div class="xbtns">'
       + '<button class="btn-norm '+(st==="N"?"on":"")+'" data-a="xnorm" data-k="'+k+'">'+(st==="N"?"NORMAL ✓":"NORMAL")+'</button>'
       + '<button class="btn-alt '+(st==="A"?"on":"")+'" data-a="xalt" data-k="'+k+'">'+(st==="A"?"ALTERADO ✓":"ALTERADO")+'</button>'
       + '</div></div>';
    if(k==="b") h += botoesLS();
    if(k==="c") h += botoesFAST() + botoesPlus();
    if(conflitoX(k)) h += '<div class="alert a" style="margin:4px 0 6px">'+conflitoX(k)+'</div>';
    /* campo sempre à mão: escrever nele já marca a letra como ALTERADO */
    h += fArea(k+"_alterado","Alterações em "+L,"em branco se normal — descreva aqui o que fugiu do padrão");
    h += '<div class="opts" style="margin-top:8px">';
    intervs.forEach(v=>{ h += '<button class="opt '+(tem(k+"_int",v)?"on":"")+'" data-a="multi" data-k="'+k+'_int" data-v="'+v+'">'+v+'</button>'; });
    h += '</div></div>';
  });
  h += '<div style="margin-top:6px">'
    + fRadio("resposta_volume","Resposta a volume",["Não precisou","Respondedor","Transitório","Não respondedor"])
    + '</div>'
    + '<div class="grid g3" style="margin-top:10px">'
    + fTexto("cristaloide_sala","Cristaloide na sala (mL)","","number")
    + fTexto("be","BE","","number") + fTexto("lactato","Lactato","","number")
    + '</div></div>';
  return h;
}

/* --- 8 · escores --- */
function secEscores(){
  const si = shockIndex(), rb = rabtPontos();
  const {cg,cp,cr} = rtsCodificado();
  const rt = rtsT(), rw = rtsW(), is = iss(), ps = triss();
  const nreg = issRegioesPreenchidas();
  const falta = [];
  if(gcsTotal()===null) falta.push("Glasgow (O, V e M em Admissão)");
  if(cp===null) falta.push("PA sistólica de admissão");
  if(cr===null) falta.push("frequência respiratória de admissão");

  let h = '<div class="sec"><h2>Na sala — calculados automaticamente</h2>';

  h += '<div class="grid g2">';
  h += '<div class="score '+(si===null?"":(si>=1?"r":"g"))+'"><div class="sl">Shock Index</div>'
     + '<div class="sv">'+(si===null?"—":si.toFixed(2))+'</div>'
     + '<div class="sd">'+(si===null?"Precisa de FC e PA sistólica"
        : (si>=1?"≥ 1,0 — perfusão comprometida":"Abaixo de 1,0"))+'</div></div>';
  const rbItens = [rabtTorso()?"penetrante em torso":null,
                   get("efast_global")==="Positivo"?"FAST+":null,
                   (si!==null&&si>1)?"Shock Index > 1,0":null,
                   get("rabt_pelve")?"fratura de pelve":null].filter(Boolean).join(" · ");
  h += '<div class="score '+(rb>=2?"r":"g")+'"><div class="sl">RABT</div>'
     + '<div class="sv">'+rb+' / 4</div>'
     + '<div class="sd">'+(rbItens?rbItens+" — ":"")
     + (rb>=2?"critério atingido, acionar transfusão maciça":"abaixo do gatilho")+'</div></div>';
  h += '</div>';

  h += '<div class="score '+(rt===null?"":(rt<=10?"r":"g"))+'" style="margin-top:10px">'
     + '<div class="sl">RTS — Revised Trauma Score</div>'
     + '<div class="sv">'+(rt===null?"—":rt+" / 12")+'<span style="font-size:15px; font-weight:600; color:var(--mut); margin-left:12px">ponderado '+(rw===null?"—":rw.toFixed(4))+' / 7,8408</span></div>'
     + '<div class="sd">'+(rt===null? "Faltam dados: "+falta.join(", ")
        : "Glasgow "+cg+" · PA sistólica "+cp+" · frequência respiratória "+cr
          + (rt<=10?" — RTS ≤ 10 costuma indicar necessidade de centro de trauma":""))+'</div></div>';

  h += '<p class="hint" style="margin-top:8px">O RTS usa a <b>primeira</b> aferição, antes de qualquer reposição volêmica. '
     + 'O valor ponderado alimenta o TRISS.</p></div>';

  /* ----- ISS ----- */
  h += '<div class="sec"><h2>ISS — preencher depois, com laudo definitivo</h2>'
     + '<p class="hint" style="margin:-4px 0 10px">AIS de 0 a 6 em cada região. '
     + 'O ISS soma os quadrados dos três maiores. Qualquer região com AIS 6 força ISS 75.</p>';
  AIS_REGIOES.forEach(([k,rot])=>{
    h += '<div class="fld" style="margin-bottom:8px"><label>'+rot+'</label><div class="opts">'
      + [0,1,2,3,4,5,6].map(n=>'<button class="opt '+(String(get(k))===String(n)?"on "+(n>=5?"warn":""):"")
        +'" data-a="radio" data-k="'+k+'" data-v="'+n+'" style="min-width:52px; justify-content:center">'+n+'</button>').join("")
      + '</div></div>';
  });
  h += '<div class="score '+(is===null?"":(is>=16?"r":"g"))+'"><div class="sl">ISS</div>'
     + '<div class="sv">'+(is===null?"—":is)+'</div>'
     + '<div class="sd">'+(is===null? "Nenhuma região pontuada ainda"
        : (nreg<6 ? "Atenção: apenas "+nreg+" de 6 regiões pontuadas — as demais estão contando como zero. "
                  : "")
          + (is>=16?"ISS ≥ 16 — politrauma grave":"ISS < 16"))+'</div></div></div>';

  /* ----- TRISS ----- */
  const pen = trissPenetrante();
  const idade = +get("idade");
  h += '<div class="sec"><h2>TRISS — probabilidade de sobrevida</h2>'
     + fRadio("triss_mecanismo","Coeficientes",["Contuso","Penetrante"])
     + '<p class="hint" style="margin:6px 0 10px">Se não escolher, o app deduz do mecanismo registrado em Cena. '
     + 'Menores de 15 anos usam coeficientes de trauma contuso, por convenção.</p>'
     + '<div class="score '+(ps===null?"":(ps>=90?"g":(ps>=50?"a":"r")))+'">'
     + '<div class="sl">Ps — TRISS</div>'
     + '<div class="sv">'+(ps===null?"—":ps.toFixed(1)+"%")+'</div>'
     + '<div class="sd">'+(ps===null
        ? "Precisa de RTS completo, ISS e idade"
        : "Coeficientes "+(pen?"penetrante":"contuso")+" · RTS ponderado "+rw.toFixed(4)
          +" · ISS "+is+" · idade "+idade+" anos (índice "+(idade>=55?1:0)+")")+'</div></div>'
     + '<div class="alert a" style="margin-top:12px">Os coeficientes são os do MTOS, publicados por Boyd em 1987, '
       + 'e continuam sendo a referência clássica — mas superestimam mortalidade em casuísticas atuais. '
       + 'Use o TRISS como descritor de gravidade da amostra, não como prognóstico individual à beira do leito.</div>'
     + '</div>';
  return h;
}

/* ============================ EVENTOS ============================ */
function ligar(){
  app.querySelectorAll("[data-a]").forEach(el=>{
    el.addEventListener("click", ev=>{
      const a = el.dataset.a, k = el.dataset.k, v = el.dataset.v, i = el.dataset.i, u = el.dataset.u;
      if(a==="novo") return novoCaso();
      if(a==="abrir"){ atualUid = u; aba=0; vista="ficha"; PARSE_MSG=""; return render(); }
      if(a==="apagar"){
        const c = CASOS.find(x=>x._uid===u);
        if(c && confirm("Apagar o caso "+(c.id||"?")+"? Esta ação não tem volta.\nSe for caso real, exporte o CSV antes.")){
          /* "lápide" em vez de remover: senão outro aparelho/aba ressuscita o caso */
          Object.keys(c).forEach(key=>{ if(["_uid","id","_criado"].indexOf(key)<0) delete c[key]; });
          c._apagado = true; atualUid = c._uid; salvar(); atualUid = null; render();
        }
        return;
      }
      if(a==="aba"){ aba = +i; return render(); }
      if(a==="radio"){
        set(k, get(k)===v ? undefined : v);
        if(/^efast_ls_[de]$/.test(k) || /^fast_/.test(k) || k==="efast_sinfise_cm") sincronizarExameX();
        return render();
      }
      if(a==="multi"){
        if(k==="tc_contraste"){
          const c = caso(), atual = Array.isArray(c.tc_contraste) ? c.tc_contraste : [];
          if(v==="Sem contraste" && atual.indexOf(v)<0) c.tc_contraste = [];
          else if(v!=="Sem contraste") c.tc_contraste = atual.filter(x=>x!=="Sem contraste");
        }
        toggleMulti(k,v);
        if(k==="mecanismo") aplicarVelocidade();
        if(k==="agravantes" && v==="Alta velocidade") delete caso()._imp_vel;  /* escolha manual prevalece */
        return render();
      }
      if(a==="bool"){ if(k==="rabt_pelve") delete caso()._imp_pelve; set(k, get(k) ? undefined : true); return render(); }
      if(a==="agora"){
        if(get(k)) return render();               /* toque duplo não sobrescreve */
        const c = caso(); const agora = new Date();
        c["_ts_"+k] = agora.toISOString();        /* com segundos, para auditoria */
        const imp = HORARIO_IMPLICA[k];
        if(imp && imp[1] && !c[imp[0]]){ c[imp[0]] = imp[1]; c["_imp_"+k] = true; }
        set(k, dois(agora.getHours())+":"+dois(agora.getMinutes()));
        if(navigator.vibrate) navigator.vibrate(30);
        return render();
      }
      if(a==="limpar"){
        const rot = (HORARIOS.find(x=>x[0]===k)||[k,k])[1];
        if(confirm("Desfazer o horário de \""+rot+"\" ("+(get(k)==="NA"?"N/A":get(k))+")?\nUse só se foi toque por engano.")){
          const c = caso(); delete c["_ts_"+k];
          /* desfaz também o que o toque tinha preenchido sozinho em outra aba */
          if(c["_imp_"+k]){ delete c[HORARIO_IMPLICA[k][0]]; delete c["_imp_"+k]; }
          set(k, undefined);
        }
        return render();
      }
      if(a==="na"){ const c=caso(); delete c["_ts_"+k]; set(k, get(k)==="NA" ? undefined : "NA"); return render(); }
      if(a==="editar"){
        const atualv = (get(k)&&get(k)!=="NA") ? get(k) : "";
        const r = prompt("Horário no formato HH:MM", atualv);
        if(r!==null){
          const t = r.trim();
          if(t==="") set(k, undefined);
          else if(/^\d{1,2}:\d{2}$/.test(t)) set(k, dois(+t.split(":")[0])+":"+t.split(":")[1]);
          else alert("Formato inválido. Use HH:MM, por exemplo 22:05.");
        }
        return render();
      }
      if(a==="lsbil"){
        const bil = get("efast_ls_d")==="Positivo" && get("efast_ls_e")==="Positivo";
        const c = caso();
        if(bil){ delete c.efast_ls_d; delete c.efast_ls_e; } else { c.efast_ls_d = "Positivo"; c.efast_ls_e = "Positivo"; }
        sincronizarExameX(); return render();
      }
      if(a==="st"){
        const c = caso();
        if(stAcionado()){
          if(!confirm("Desfazer o acionamento do sangue total?")) return;
          delete c.st_acionado; delete c.h_st; delete c._ts_h_st; delete c._imp_h_st;
          salvar(); return render();
        }
        const agora = new Date();
        c.st_acionado = "Sim";
        if(!c.h_st || c.h_st==="NA"){ c.h_st = dois(agora.getHours())+":"+dois(agora.getMinutes()); c._ts_h_st = agora.toISOString(); }
        if(navigator.vibrate) navigator.vibrate(40);
        salvar(); return render();
      }
      if(a==="torso"){
        if(cenaContusa()){ alert("A Cena registrou trauma contuso. Corrija o tipo de trauma em iMIST-AMBO se o ferimento for penetrante."); return; }
        set("rabt_torso", get("rabt_torso")==="Sim" ? undefined : "Sim"); return render();
      }
      if(a==="xnorm"){
        if(estadoX(k)==="N"){ set(k+"_normal", undefined); return render(); }
        if(EXAME_X[k] && !get(EXAME_X[k][0])){ alert("Preencha o "+EXAME_X[k][1]+" antes de declarar "+k.toUpperCase()+" normal."); return; }
        if((k==="b" && get("efast_ls")==="Negativo") || (k==="c" && (get("efast_global")==="Positivo" || pelveInstavel()))){
          alert(k==="b" ? "LS negativo: a letra B está alterada." : "FAST positivo ou pelve instável: a letra C está alterada."); return;
        }
        if(get(k+"_alterado") && !confirm("Marcar NORMAL apaga a descrição do que estava alterado. Continuar?")) return;
        const c = caso(); delete c[k+"_alterado"]; delete c[k+"_alt"];
        set(k+"_normal", true); return render();
      }
      if(a==="xalt"){
        if(estadoX(k)==="A"){
          if(get(k+"_alterado")){ alert("Apague a descrição antes de desmarcar ALTERADO."); return; }
          set(k+"_alt", undefined); return render();
        }
        const c = caso(); delete c[k+"_normal"];
        set(k+"_alt", true); render();
        const ta = app.querySelector('textarea[data-k="'+k+'_alterado"]'); if(ta) ta.focus();
        return;
      }
      if(a==="fechar"){ set("_fechado", get("_fechado") ? undefined : true); return render(); }
      if(a==="parse"){ parseAPH(); return render(); }
      if(a==="export") return exportar();
    });
  });
  app.querySelectorAll("[data-k]").forEach(el=>{
    if(el.tagName==="INPUT" || el.tagName==="TEXTAREA"){
      el.addEventListener("input", ()=>{
        set(el.dataset.k, el.value);
        /* atualiza só o bloco de cálculo — nunca redesenha o formulário
           enquanto alguém digita, sob pena de perder o valor e fechar o teclado */
        const alvo = document.getElementById("calc-adm");
        if(alvo && (el.dataset.k==="adm_pas" || el.dataset.k==="adm_fc")) alvo.innerHTML = calcAdmHTML();
        const mx = /^([xabcde])_alterado$/.exec(el.dataset.k);
        if(mx && el.value.trim()){
          const L = mx[1], c = caso();
          if(c[L+"_normal"] || !c[L+"_alt"]){ delete c[L+"_normal"]; c[L+"_alt"] = true; salvar(); }
          const row = el.closest(".xrow");
          if(row){
            row.classList.remove("ok"); row.classList.add("alt");
            const bn = row.querySelector('[data-a="xnorm"]'), ba = row.querySelector('[data-a="xalt"]');
            if(bn){ bn.classList.remove("on"); bn.textContent = "NORMAL"; }
            if(ba){ ba.classList.add("on"); ba.textContent = "ALTERADO ✓"; }
          }
        }
      });
      if(el.dataset.k==="h_trauma") el.addEventListener("change", ()=> render());
      if(el.dataset.k==="velocidade") el.addEventListener("change", ()=>{ aplicarVelocidade(); render(); });
      if(el.dataset.k==="efast_sinfise_cm") el.addEventListener("change", ()=>{ sincronizarExameX(); render(); });
      if(el.dataset.k==="t_ch" || el.dataset.k==="calcio_ampolas") el.addEventListener("change", ()=>{
        const c = caso(); if((parseInt(c.calcio_ampolas,10)||0)>0) c.calcio_reposto_sala = true; else delete c.calcio_reposto_sala;
        salvar(); render();
      });
    }
  });
}
