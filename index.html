<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c141f">
<title>A ficha mudou de endereço</title>
<style>
  :root{color-scheme:dark}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:#0c141f; color:#e6edf5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; box-sizing:border-box}
  .box{max-width:460px; text-align:center}
  h1{font-size:22px; letter-spacing:1.5px; text-transform:uppercase; margin:0 0 12px}
  p{color:#8fa2bb; line-height:1.6; margin:0 0 18px}
  a.btn,button{display:block; width:100%; box-sizing:border-box; padding:16px; border-radius:10px; border:0;
       font-size:17px; font-weight:800; text-decoration:none; margin:10px 0; cursor:pointer}
  a.btn{background:#c62828; color:#fff}
  button{background:#1d2c43; color:#e6edf5; border:1px solid #2a3b55}
  .url{color:#9cc3ef; font-weight:700}
  .aviso{background:rgba(212,167,44,.13); border:1px solid #d4a72c; color:#f2cc60; border-radius:10px; padding:12px; text-align:left; font-size:14px; line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <h1>A ficha mudou de endereço</h1>
  <p>Ficha de Padronização Assistencial de Atendimento ao Politraumatizado<br>
     agora está em <span class="url">traumapscgepm.github.io</span></p>
  <div id="extra"></div>
  <a class="btn" href="https://traumapscgepm.github.io/">Abrir a ficha no novo endereço</a>
  <p style="font-size:13px; margin-top:16px">Depois de abrir, adicione o novo endereço à Tela de Início e apague o ícone antigo.</p>
</div>
<script>
/* casos guardados só neste endereço antigo (sem login na nuvem) não passam sozinhos:
   oferece o backup antes de sair */
var casos = [];
try{ casos = JSON.parse(localStorage.getItem("fichaTrauma.casos.v1") || "[]").filter(function(c){ return c && !c._apagado; }); }catch(e){}
if(casos.length){
  document.getElementById("extra").innerHTML =
    '<div class="aviso"><b>'+casos.length+' caso(s) guardado(s) neste aparelho no endereço antigo.</b> '
    + 'Se você já entrava com a conta da nuvem (☁︎), eles já estão no novo endereço. '
    + 'Se não, baixe o backup e, no novo endereço, use Exportar dados → Importar backup.</div>'
    + '<button id="bk">Baixar backup dos casos</button>';
  document.getElementById("bk").onclick = function(){
    var b = new Blob([JSON.stringify(casos,null,2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = "backup-ficha-trauma-endereco-antigo.json"; document.body.appendChild(a); a.click(); a.remove();
  };
}else{
  setTimeout(function(){ location.replace("https://traumapscgepm.github.io/"); }, 2500);
}
/* desliga o app offline antigo, para o iPhone não continuar abrindo a versão em cache */
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
}
if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
</script>
</body>
</html>
