<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%2337e2b0' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2337e2b0'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #02040a;
    --ink: #e8f1ff;
    --mut: #8aa0bf;
    --dim: #4d5f7a;
    --glass: rgba(10, 18, 32, 0.72);
    --edge: rgba(120, 170, 255, 0.18);
    --accent: #37e2b0;
    --warn: #ff6b7d;
    --radius: 16px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  #galaxy { position: fixed; inset: 0; }
  button { font: inherit; color: inherit; }
  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: var(--radius);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 16px; left: 16px; display: flex; align-items: center; gap: 12px;
    pointer-events: none; user-select: none; }
  .reactor { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent);
    display: grid; place-items: center; box-shadow: 0 0 18px rgba(55, 226, 176, .35); }
  .reactor::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 12px var(--accent); animation: pulse 3.2s ease-in-out infinite; }
  body.speaking .reactor::after { animation-duration: .55s; }
  body.listening .reactor { border-color: var(--warn); }
  body.listening .reactor::after { background: var(--warn); box-shadow: 0 0 12px var(--warn); animation-duration: 1s; }
  @keyframes pulse { 0%, 100% { transform: scale(.75); opacity: .7 } 50% { transform: scale(1.15); opacity: 1 } }
  .brand { font-weight: 700; letter-spacing: .32em; font-size: 14px; }
  .count { font: 12px/1.2 var(--mono); color: var(--mut); letter-spacing: .04em; }

  /* ---------- legenda ---------- */
  #legend { position: fixed; left: 16px; bottom: 120px; display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--mut); }
  #legend button { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 2px 4px;
    color: inherit; cursor: pointer; border-radius: 8px; text-align: left; }
  #legend button:hover { color: var(--ink); background: rgba(255,255,255,.05); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }

  /* ---------- painel da nota ---------- */
  #panel { position: fixed; top: 16px; right: 16px; width: min(380px, calc(100vw - 32px));
    max-height: calc(100vh - 260px); overflow: auto; padding: 18px 18px 16px; display: none; }
  #panel.open { display: block; animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  #panel h2 { margin: 6px 34px 2px 0; font-size: 19px; line-height: 1.25; }
  .chip-group { display: inline-flex; align-items: center; gap: 6px; font: 11px/1 var(--mono); color: var(--mut);
    text-transform: uppercase; letter-spacing: .08em; }
  .path { font: 11px/1.4 var(--mono); color: var(--dim); margin-bottom: 12px; word-break: break-all; }
  .excerpt { white-space: pre-wrap; color: #cfdcf0; font-size: 14px; }
  .excerpt code { font: 12.5px var(--mono); background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; }
  .excerpt .h { font-weight: 700; color: var(--ink); }
  .wl { color: var(--accent); cursor: pointer; text-decoration: none; border-bottom: 1px dashed rgba(55,226,176,.45); }
  .wl.dead { color: var(--mut); cursor: default; border-bottom-color: transparent; }
  .rel { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--edge); }
  .rel-title { font: 11px/1 var(--mono); color: var(--mut); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--edge); background: rgba(255,255,255,.04); cursor: pointer; font-size: 12.5px; }
  .chip:hover { border-color: rgba(55,226,176,.5); }
  .x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--edge);
    background: rgba(255,255,255,.04); cursor: pointer; line-height: 1; }

  /* ---------- resposta + barra ---------- */
  #dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 8px; transition: left .35s ease, width .35s ease; }
  #answer { padding: 14px 18px; display: none; }
  #answer.show { display: block; animation: rise .35s ease-out; }
  #answer .q { font-size: 12.5px; color: var(--mut); margin-bottom: 4px; }
  #answer .a { font-size: 16px; line-height: 1.5; }
  #answer .chips { margin-top: 10px; }
  #status { min-height: 18px; padding: 0 6px; font: 12px/1.5 var(--mono); color: var(--accent); }
  #status.err { color: var(--warn); }
  #ask { display: flex; align-items: center; gap: 8px; padding: 7px; border-radius: 999px; }
  #q { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink); font-size: 16px; padding: 8px 6px; }
  #q::placeholder { color: var(--dim); }
  .round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--edge); background: rgba(255,255,255,.05);
    cursor: pointer; display: grid; place-items: center; flex: none; font-size: 17px; }
  .round:hover { border-color: rgba(55,226,176,.6); }
  .round:disabled { opacity: .35; cursor: not-allowed; }
  #mic.on { background: rgba(255,107,125,.18); border-color: var(--warn); animation: ring 1.2s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,107,125,.5) } 100% { box-shadow: 0 0 0 14px rgba(255,107,125,0) } }
  #send { background: var(--accent); color: #02130d; border-color: transparent; font-weight: 700; }

  #hint { position: fixed; top: 58px; left: 16px; font: 12px var(--mono); color: var(--mut); opacity: .85; }
  #fatal { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--mut); }
  #fatal.show { display: grid; }
  .tip { font: 12px/1.35 var(--mono); padding: 6px 9px; border-radius: 8px; background: rgba(5,10,20,.88);
    border: 1px solid var(--edge); color: var(--ink); }
  .tip span { color: var(--mut); }

  /* tela larga: com o painel aberto, a barra se recentra no espaço livre à esquerda */
  @media (min-width: 1000px) {
    body.panel-open #panel { max-height: calc(100vh - 32px); }
    body.panel-open #dock { left: calc((100vw - 412px) / 2); width: min(760px, calc(100vw - 460px)); }
  }
  @media (max-width: 720px) {
    #panel { top: 64px; max-height: 40vh; }
    #answer { max-height: 24vh; overflow: auto; }
    #legend { display: none; }
    #answer .a { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="galaxy"></div>

<header id="hud">
  <div class="reactor" aria-hidden="true"></div>
  <div>
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="count" id="count">…</div>
  </div>
</header>
<div id="hint" hidden></div>
<nav id="legend" aria-label="Grupos"></nav>

<aside id="panel" class="glass" aria-live="polite">
  <button class="x" id="close" type="button" aria-label="Fechar">×</button>
  <div id="panel-body"></div>
</aside>

<div id="dock">
  <section id="answer" class="glass" aria-live="polite"></section>
  <div id="status" role="status"></div>
  <form id="ask" class="glass" autocomplete="off">
    <button class="round" id="mic" type="button" aria-label="Falar">🎙</button>
    <input id="q" name="q" enterkeyhint="send">
    <button class="round" id="send" type="submit" aria-label="Enviar">➤</button>
  </form>
</div>
<div id="fatal"></div>

<script src="graph-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/dist/3d-force-graph.min.js"></script>
<script type="module">
/* ======================================================================
   JARVIS · viewer — galáxia 3D (Prompt 1), barra de pergunta (2), voz (3),
   fly-to-source (4), saudação (5) e memória por voz (6).
   ====================================================================== */

const STR = {
  pt: {
    placeholder: "Pergunte às suas notas — ou diga “lembre que…”",
    listening: "● ouvindo…", thinking: "● pensando…", speaking: "● falando…", saving: "● guardando na memória…",
    clickToHear: "clique em qualquer lugar para ligar a voz",
    micUnsupported: "Reconhecimento de voz: use Chrome ou Edge.",
    micBlocked: "Microfone bloqueado: cadeado na barra de endereço → Microfone → Permitir.",
    micNoSpeech: "Não ouvi nada. Tente de novo.",
    micNetwork: "O reconhecimento de voz do Chrome precisa de internet.",
    count: (n, l) => `${n} ${n === 1 ? "nota" : "notas"} · ${l} ${l === 1 ? "ligação" : "ligações"}`,
    greeting: n => `${dayPart("pt")}, senhor. ${n} ${n === 1
      ? "nota indexada, presente e contabilizada" : "notas indexadas, todas presentes e contabilizadas"}.`,
    you: "Você", sources: "Fontes", linked: "Ligada a", cluster: n => `${n} notas sustentam a resposta`,
    newMemory: "nova memória",
    stale: "A galáxia mudou no servidor: recarregue a página (Cmd/Ctrl+Shift+R).",
    noGraph: "graph-data.js não carregou. Na pasta jarvis/, rode python3 server.py e abra http://localhost:4700",
    noLib: "Não consegui carregar a biblioteca 3D da CDN. Sem internet?",
    noServer: "Servidor fora do ar. Rode python3 server.py na pasta jarvis/.",
    brainOff: "Cérebro desligado: cole sua API key em config.json (ou instale o Claude Code).",
    mic: "Falar", send: "Enviar", close: "Fechar",
  },
  en: {
    placeholder: "Ask your notes — or say “remember that…”",
    listening: "● listening…", thinking: "● thinking…", speaking: "● speaking…", saving: "● filing it away…",
    clickToHear: "click anywhere to switch the voice on",
    micUnsupported: "Speech recognition needs Chrome or Edge.",
    micBlocked: "Microphone blocked: lock icon in the address bar → Microphone → Allow.",
    micNoSpeech: "I didn't catch anything. Try again.",
    micNetwork: "Chrome's speech recognition needs an internet connection.",
    count: (n, l) => `${n} ${n === 1 ? "note" : "notes"} · ${l} ${l === 1 ? "link" : "links"}`,
    greeting: n => `${dayPart("en")}, sir. ${n} ${n === 1
      ? "note indexed, present and accounted for" : "notes indexed, all present and accounted for"}.`,
    you: "You", sources: "Sources", linked: "Linked to", cluster: n => `${n} notes behind this answer`,
    newMemory: "new memory",
    stale: "The galaxy changed on the server: reload the page (Cmd/Ctrl+Shift+R).",
    noGraph: "graph-data.js did not load. In jarvis/, run python3 server.py and open http://localhost:4700",
    noLib: "Could not load the 3D library from the CDN. Offline?",
    noServer: "Server is down. Run python3 server.py in jarvis/.",
    brainOff: "Brain offline: paste your API key into config.json (or install Claude Code).",
    mic: "Speak", send: "Send", close: "Close",
  },
};

function dayPart(lg) {
  const h = new Date().getHours();
  if (lg === "pt") return h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  return h < 5 ? "Good evening" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

// mesma regra do server.py: frases que viram nota nova em vez de pergunta
const REMEMBER_RE = /^\s*(?:jarvis[\s,:;.!-]*)?(?:remember(?:\s+that)?|lembr(?:e|a|ar)(?:[-\s]se)?(?:\s+de)?\s+que|anot(?:e|a|ar)(?:\s+a[ií])?(?:\s+que)?|guard(?:e|a)(?:\s+a[ií])?\s+(?:que|isso)|memoriz(?:e|a)(?:\s+que)?)(?=[\s:,.!-]|$)/i;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const idOf = end => (typeof end === "object" && end !== null ? end.id : end);

let LANG = "pt-BR", lg = "pt", T = STR.pt;
let BRAIN = "none";

function fatal(msg) { const f = $("fatal"); f.textContent = msg; f.classList.add("show"); }
function setStatus(msg, isError = false) {
  const s = $("status");
  s.textContent = msg || "";
  s.classList.toggle("err", !!isError);
}

/* ------------------------------------------------------------- dados ---- */
const DATA = typeof GRAPH !== "undefined" ? GRAPH : null;
if (!DATA) { fatal(STR.pt.noGraph); throw new Error("no graph"); }
if (typeof ForceGraph3D === "undefined") { fatal(STR.pt.noLib); throw new Error("no lib"); }
const META = DATA.meta || {};

const nodes = DATA.nodes;                 // nodes[i].id === i
const links = DATA.links.map(l => ({ source: l.source, target: l.target }));
const adj = new Map(nodes.map(n => [n.id, new Set()]));
function addAdj(s, t) { adj.get(s)?.add(t); adj.get(t)?.add(s); }
links.forEach(l => addAdj(l.source, l.target));

const byTitle = new Map();
nodes.forEach(n => { if (!byTitle.has(fold(n.label))) byTitle.set(fold(n.label), n.id); });

const PALETTE = ["#4cc9f0", "#f72585", "#ffd166", "#06d6a0", "#b388ff", "#ff9f1c", "#90e0ef", "#ef476f", "#caffbf", "#ffc6ff"];
const groupColor = new Map();
function colorOf(group) {
  if (group === "captures") return "#fff1a8";
  if (!groupColor.has(group)) groupColor.set(group, PALETTE[groupColor.size % PALETTE.length]);
  return groupColor.get(group);
}
[...new Set(nodes.map(n => n.group))].sort().forEach(colorOf);
const radius = n => 3 + Math.sqrt(adj.get(n.id)?.size || 0) * 1.6;

/* ------------------------------------------------------------ three.js ---- */
let THREE = null, UnrealBloomPass = null;
try {
  THREE = await import("three");
  ({ UnrealBloomPass } = await import("three/addons/postprocessing/UnrealBloomPass.js"));
} catch (e) {
  console.warn("three.js extras indisponíveis — galáxia sem brilho extra", e);
}

let glowTex = null, sphereGeo = null;
if (THREE) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(0.18, "rgba(255,255,255,.55)");
  grd.addColorStop(0.45, "rgba(255,255,255,.12)");
  grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  glowTex = new THREE.CanvasTexture(c);
  glowTex.colorSpace = THREE.SRGBColorSpace;
  sphereGeo = new THREE.SphereGeometry(1, 24, 16);
}

function nodeObject(n) {
  const color = new THREE.Color(colorOf(n.group));
  const r = radius(n);
  const obj = new THREE.Group();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: .4, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.setScalar(r * 5.5);
  const core = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .95 }));
  core.scale.setScalar(r);
  obj.add(glow, core);
  n.__core = core; n.__glow = glow; n.__r = r;
  return obj;
}

/* -------------------------------------------------------------- galáxia ---- */
const HL = { nodes: new Set(), links: new Set(), focus: null };

const Graph = new ForceGraph3D($("galaxy"), { controlType: "trackball" })
  .backgroundColor("#02040a")
  .showNavInfo(false)
  .nodeId("id")
  .nodeLabel(n => `<div class="tip"><b>${esc(n.label)}</b><br><span>${esc(n.group)}</span></div>`)
  .nodeColor(n => (!HL.nodes.size || HL.nodes.has(n.id)) ? colorOf(n.group) : "#1d2433")
  .nodeVal(n => radius(n) ** 2 / 4)
  .nodeOpacity(.95)
  .linkColor(l => HL.links.size ? (HL.links.has(l) ? "#ffffff" : "#141b2b") : "#3d5a8c")
  .linkOpacity(.5)
  .linkWidth(l => HL.links.has(l) ? .7 : 0)
  .linkDirectionalParticles(l => HL.links.has(l) ? 3 : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(.007)
  .linkDirectionalParticleColor(() => "#ffffff")
  .warmupTicks(80)
  .cooldownTicks(400)
  .onNodeClick(n => { focusNode(n); })
  .onNodeHover(n => { $("galaxy").style.cursor = n ? "pointer" : ""; })
  .onBackgroundClick(() => { clearHighlight(); closePanel(); });

if (THREE) Graph.nodeThreeObject(nodeObject);
Graph.d3Force("charge").strength(-95);
Graph.d3Force("link").distance(42);
Graph.graphData({ nodes, links });

setTimeout(() => { if (performance.now() > flyingUntil) flyFit(1500); }, 700); // enquadra a galáxia já assentada

// céu estrelado + brilho cinematográfico
let stars = null;
if (THREE) {
  const N = 4500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 1400 + Math.random() * 2600, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)], i * 3);
    const t = 0.55 + Math.random() * 0.45, blue = Math.random() < .3;
    col.set([t * (blue ? .75 : 1), t * (blue ? .85 : .95), t], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  stars = new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.3, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: .8, depthWrite: false }));
  Graph.scene().add(stars);
  // fundo pintado pela cena, não pelo clear do renderer: com pós-processamento, o clear
  // grava a cor já convertida para sRGB no buffer linear e o preto vira azul-marinho
  Graph.scene().background = new THREE.Color("#02040a");
  if (UnrealBloomPass) {
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .85, .35, .1);
    Graph.postProcessingComposer().addPass(bloom);
  }
}

addEventListener("resize", () => Graph.width(innerWidth).height(innerHeight));

/* ---------------------------------------------------- câmera e destaque ---- */
let lastTouch = performance.now(), flyingUntil = 0;
const IDLE_MS = 9000, DRIFT = .035; // rad/s — deriva lenta quando ninguém mexe
["pointerdown", "wheel", "touchstart"].forEach(ev =>
  $("galaxy").addEventListener(ev, () => { lastTouch = performance.now(); }, { passive: true }));

function flyTo(n, ms = 1600) {
  const dist = 110 + (n.__r || radius(n)) * 6;
  const len = Math.hypot(n.x || 0, n.y || 0, n.z || 0);
  const pos = len > 1
    ? { x: n.x * (1 + dist / len), y: n.y * (1 + dist / len), z: n.z * (1 + dist / len) }
    : { x: (n.x || 0), y: (n.y || 0), z: (n.z || 0) + dist };
  flyingUntil = performance.now() + ms + 200;
  lastTouch = performance.now();
  Graph.cameraPosition(pos, { x: n.x || 0, y: n.y || 0, z: n.z || 0 }, ms);
}
function flyFit(ms = 1400, filter) {
  flyingUntil = performance.now() + ms + 200;
  Graph.zoomToFit(ms, 70, filter);
}

function refreshLook() {
  const any = HL.nodes.size > 0;
  for (const n of Graph.graphData().nodes) {
    if (!n.__core) continue;
    const on = !any || HL.nodes.has(n.id), focus = n.id === HL.focus;
    n.__core.material.opacity = on ? 1 : .06;
    n.__glow.material.opacity = on ? (focus ? .9 : any ? .55 : .4) : .02;
    if (!n.__pulse) n.__glow.scale.setScalar(n.__r * (focus ? 8 : 5.5));
  }
  if (!THREE) Graph.nodeColor(Graph.nodeColor());   // sem three.js: nós padrão, só a cor muda
  Graph.linkColor(Graph.linkColor())
    .linkWidth(Graph.linkWidth())
    .linkDirectionalParticles(Graph.linkDirectionalParticles());
}

function highlight(ids, focusId = null) {
  HL.nodes = new Set(ids);
  HL.focus = focusId;
  HL.links = new Set(Graph.graphData().links.filter(l => {
    const s = idOf(l.source), t = idOf(l.target);
    return focusId !== null ? (s === focusId || t === focusId) : (HL.nodes.has(s) && HL.nodes.has(t));
  }));
  refreshLook();
}
function clearHighlight() { highlight([]); }

function focusNode(n, ms) {
  if (!n) return;
  flyTo(n, ms);
  highlight([n.id, ...(adj.get(n.id) || [])], n.id);
  openPanel(n);
}

/* --------------------------------------------------------------- painel ---- */
function renderExcerpt(text) {
  return esc(text)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/^(#{1,6}) (.*)$/gm, '<span class="h">$2</span>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/\[\[([^\]|#^]+)(?:[#^][^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, target, alias) => {
      const shown = (alias || target).trim();
      const id = byTitle.get(fold(target.split("/").pop()));
      return id !== undefined ? `<a class="wl" data-id="${id}">${shown}</a>` : `<span class="wl dead">${shown}</span>`;
    });
}
function chip(n) {
  return `<button class="chip" type="button" data-id="${n.id}"><span class="dot" style="color:${colorOf(n.group)};background:${colorOf(n.group)}"></span>${esc(n.label)}</button>`;
}
function openPanel(n) {
  const rel = [...(adj.get(n.id) || [])].map(i => nodeById(i)).filter(Boolean).sort((a, b) => a.label.localeCompare(b.label));
  $("panel-body").innerHTML =
    `<div class="chip-group"><span class="dot" style="color:${colorOf(n.group)};background:${colorOf(n.group)}"></span>${esc(n.group)}${n.__new ? " · " + T.newMemory : ""}</div>` +
    `<h2>${esc(n.label)}</h2><div class="path">${esc(n.path || "")}</div>` +
    `<div class="excerpt">${renderExcerpt(n.excerpt || "")}</div>` +
    (rel.length ? `<div class="rel"><div class="rel-title">${T.linked}</div><div class="chips">${rel.map(chip).join("")}</div></div>` : "");
  showPanel(true);
}
function openCluster(ids) {
  const list = ids.map(nodeById).filter(Boolean);
  $("panel-body").innerHTML = `<div class="chip-group">${T.cluster(list.length)}</div>` +
    `<div class="chips" style="margin-top:12px">${list.map(chip).join("")}</div>`;
  showPanel(true);
}
function showPanel(open) {
  $("panel").classList.toggle("open", open);
  document.body.classList.toggle("panel-open", open);
  if (open) $("panel").scrollTop = 0;
}
function closePanel() { showPanel(false); }
const nodeById = id => Graph.graphData().nodes[id];

document.addEventListener("click", e => {
  const el = e.target.closest("[data-id]");
  if (el && !el.classList.contains("dead")) focusNode(nodeById(+el.dataset.id));
});
$("close").addEventListener("click", () => { closePanel(); clearHighlight(); });

function renderLegend() {
  const counts = new Map();
  Graph.graphData().nodes.forEach(n => counts.set(n.group, (counts.get(n.group) || 0) + 1));
  $("legend").innerHTML = [...counts.keys()].sort().map(g =>
    `<button type="button" data-group="${esc(g)}"><span class="dot" style="color:${colorOf(g)};background:${colorOf(g)}"></span>${esc(g)} · ${counts.get(g)}</button>`).join("");
}
$("legend").addEventListener("click", e => {
  const b = e.target.closest("[data-group]");
  if (!b) return;
  const ids = Graph.graphData().nodes.filter(n => n.group === b.dataset.group).map(n => n.id);
  highlight(ids);
  closePanel();
  flyFit(1200, n => ids.includes(n.id));
});

/* ----------------------------------------------------------- animação ---- */
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, .1);
  last = now;
  if (stars) stars.rotation.y += dt * .004;
  for (const n of Graph.graphData().nodes) {          // pulso de nascimento (Prompt 6)
    if (!n.__pulse || !n.__glow) continue;
    const k = (now - n.__pulse) / 1800;
    if (k >= 1) { n.__pulse = 0; refreshLook(); continue; }
    n.__glow.scale.setScalar(n.__r * (8 + 22 * Math.sin(Math.PI * k) * (1 - k)));
    n.__glow.material.opacity = 1;
  }
  if (now - lastTouch > IDLE_MS && now > flyingUntil) { // deriva ociosa em volta do alvo
    const cam = Graph.camera(), tgt = Graph.controls().target;
    if (cam && tgt) {
      const a = DRIFT * dt, dx = cam.position.x - tgt.x, dz = cam.position.z - tgt.z;
      cam.position.x = tgt.x + dx * Math.cos(a) - dz * Math.sin(a);
      cam.position.z = tgt.z + dx * Math.sin(a) + dz * Math.cos(a);
      cam.lookAt(tgt);
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------------------------------------------------------------- voz ---- */
let unlocked = false, pending = null, utter = null, keepAlive = null;

function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const want = LANG.toLowerCase(), base = want.slice(0, 2);
  const norm = v => v.lang.toLowerCase().replace("_", "-");
  const pool = vs.filter(v => norm(v) === want).length ? vs.filter(v => norm(v) === want) : vs.filter(v => norm(v).startsWith(base));
  const score = v => (/premium|enhanced|natural|neural/i.test(v.name) ? 4 : 0)
    + (/daniel|arthur|uk english male|ryan|thomas|george|oliver|felipe|antonio|thiago|ricardo/i.test(v.name) ? 2 : 0)
    + (v.localService ? 1 : 0);
  return pool.sort((a, b) => score(b) - score(a))[0] || null;
}

function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  if (!unlocked) { pending = text; return; }   // navegador bloqueia áudio antes do 1º clique
  speechSynthesis.cancel();
  utter = new SpeechSynthesisUtterance(text);  // referência global: o Chrome coleta e perde o onend
  const v = pickVoice();
  if (v) { utter.voice = v; utter.lang = v.lang; } else utter.lang = LANG;
  utter.rate = 1.02;
  utter.pitch = .95;
  utter.onstart = () => {
    document.body.classList.add("speaking");
    setStatus(T.speaking);
    clearInterval(keepAlive);   // Chrome corta falas longas sem isso
    keepAlive = setInterval(() => { if (speechSynthesis.speaking) { speechSynthesis.pause(); speechSynthesis.resume(); } }, 9000);
  };
  utter.onend = utter.onerror = () => {
    document.body.classList.remove("speaking");
    clearInterval(keepAlive);
    if ($("status").textContent === T.speaking) setStatus("");
  };
  setTimeout(() => speechSynthesis.speak(utter), 60); // falar logo após cancel() às vezes é engolido
}

function unlockVoice() {
  if (unlocked) return;
  unlocked = true;
  $("hint").hidden = true;
  if (!("speechSynthesis" in window)) return;
  // a 1ª fala precisa nascer dentro do gesto do usuário (Safari/Chrome)
  const first = new SpeechSynthesisUtterance(pending ? "" : " ");
  speechSynthesis.speak(first);
  if (pending) { const p = pending; pending = null; speak(p); }
}
["pointerdown", "keydown"].forEach(ev => addEventListener(ev, unlockVoice, { capture: true }));
if ("speechSynthesis" in window) speechSynthesis.getVoices(); // o Chrome carrega as vozes de forma assíncrona

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function toggleMic() {
  if (!SR) { setStatus(T.micUnsupported, true); return; }
  if (rec) { rec.stop(); return; }
  window.speechSynthesis?.cancel();        // não escutar a própria voz
  let finalText = "", failed = false;
  rec = new SR();
  rec.lang = LANG;
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => { $("mic").classList.add("on"); document.body.classList.add("listening"); setStatus(T.listening); };
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $("q").value = (finalText + interim).trim();
  };
  rec.onerror = e => {
    failed = true;
    setStatus(e.error === "not-allowed" || e.error === "service-not-allowed" ? T.micBlocked
      : e.error === "no-speech" ? T.micNoSpeech : e.error === "network" ? T.micNetwork : "mic: " + e.error, true);
  };
  rec.onend = () => {
    rec = null;
    $("mic").classList.remove("on");
    document.body.classList.remove("listening");
    const text = (finalText || $("q").value).trim();
    if (failed) return;
    if (text) submit(text); else setStatus("");
  };
  try { rec.start(); } catch (err) { rec = null; setStatus(String(err), true); }
}
$("mic").addEventListener("click", toggleMic);
if (!SR) $("mic").title = STR.pt.micUnsupported;

/* ------------------------------------------------------------- cérebro ---- */
const SID = (() => {
  try {
    let s = sessionStorage.getItem("jarvis.session");
    if (!s) { s = crypto.randomUUID(); sessionStorage.setItem("jarvis.session", s); }
    return s;
  } catch { return "s" + Math.random().toString(36).slice(2); }
})();

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = null;
  try { data = await res.json(); } catch { /* corpo vazio */ }
  if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
  return data;
}

function showAnswer(question, answer, sourceIds = []) {
  const src = sourceIds.map(nodeById).filter(Boolean);
  $("answer").innerHTML = (question ? `<div class="q">${T.you}: ${esc(question)}</div>` : "") +
    `<div class="a">${esc(answer)}</div>` +
    (src.length ? `<div class="chips">${src.map(chip).join("")}</div>` : "");
  $("answer").classList.add("show");
}

let busy = false;
async function submit(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  $("q").value = "";
  try {
    if (REMEMBER_RE.test(text)) await remember(text);
    else await ask(text);
  } catch (err) {
    const msg = String(err.message || err);
    setStatus(/failed to fetch|networkerror|load failed/i.test(msg) ? T.noServer : msg, true);
  } finally {
    busy = false;
  }
}

async function ask(question) {
  setStatus(T.thinking);
  const r = await post("/chat", { question, session: SID });
  setStatus("");
  const ids = (r.nodes || []).filter(i => nodeById(i));
  showAnswer(question, r.answer, ids);
  speak(r.answer);
  if (r.build_id && META.build_id && r.build_id !== META.build_id) { setStatus(T.stale, true); return; }
  flyToSources(ids);
}

// Prompt 4: a galáxia prova de onde veio a resposta
function flyToSources(ids) {
  if (!ids.length) return;                 // conversa fiada: a câmera fica onde está
  if (ids.length >= 4) {                   // muitas fontes: acende o aglomerado inteiro
    highlight(ids);
    openCluster(ids);
    flyFit(1600, n => ids.includes(n.id));
    return;
  }
  focusNode(nodeById(ids[0]), 1800);
}

async function remember(text) {
  setStatus(T.saving);
  const r = await post("/remember", { text });
  setStatus("");
  const gd = Graph.graphData();
  if (r.node.id !== gd.nodes.length) { setStatus(T.stale, true); return; }
  const anchor = r.anchor !== null && r.anchor !== undefined ? nodeById(r.anchor) : null;
  const n = Object.assign({}, r.node, { __new: true });
  const jitter = () => (Math.random() - .5) * 14;
  const at = anchor || { x: 0, y: 0, z: 0 };
  n.x = (at.x || 0) + jitter(); n.y = (at.y || 0) + jitter(); n.z = (at.z || 0) + jitter();
  adj.set(n.id, new Set());
  r.links.forEach(l => addAdj(l.source, l.target));
  byTitle.set(fold(n.label), n.id);
  META.build_id = r.build_id;
  Graph.graphData({ nodes: [...gd.nodes, n], links: [...gd.links, ...r.links.map(l => ({ source: l.source, target: l.target }))] });
  n.__pulse = performance.now();          // nasce com um pulso de luz
  updateCount();
  renderLegend();
  showAnswer(text, r.line, [n.id]);
  speak(r.line);
  setTimeout(() => focusNode(n, 1600), 350);
}

/* ---------------------------------------------------------------- boot ---- */
$("ask").addEventListener("submit", e => { e.preventDefault(); submit($("q").value); });
addEventListener("keydown", e => {
  if (e.key === "Escape") { closePanel(); clearHighlight(); }
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

function updateCount() {
  const gd = Graph.graphData();
  $("count").textContent = T.count(gd.nodes.length, gd.links.length);
}

function applyLanguage(code) {
  LANG = code || "pt-BR";
  lg = LANG.toLowerCase().startsWith("pt") ? "pt" : "en";
  T = STR[lg];
  document.documentElement.lang = LANG;
  $("q").placeholder = T.placeholder;
  $("mic").setAttribute("aria-label", T.mic);
  $("send").setAttribute("aria-label", T.send);
  $("close").setAttribute("aria-label", T.close);
}

(async () => {
  let status = null;
  try { status = await (await fetch("/api/status", { cache: "no-store" })).json(); } catch { /* sem servidor */ }
  applyLanguage(status && status.language);
  BRAIN = status ? status.brain : "none";
  updateCount();
  renderLegend();
  if (!status) { setStatus(T.noServer, true); return; }
  if (status.build_id && META.build_id && status.build_id !== META.build_id) setStatus(T.stale, true);
  else if (BRAIN === "none") setStatus(T.brainOff, true);
  const greet = T.greeting(status.notes ?? nodes.length);
  showAnswer("", greet);
  if (!unlocked) { $("hint").textContent = T.clickToHear; $("hint").hidden = false; }
  speak(greet);
})();
</script>
